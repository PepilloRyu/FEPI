<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./scss/landingpage.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/landingpage.js" defer></script>
    <title>MathGo - Aprende Álgebra</title>
    <link rel="icon" href="./assets/images/favicon.ico" />
  </head>
  <body>
    <header class="landing-header">
      <div class="header-navbar">
        <nav class="landing-navbar">
          <a href="/" class="mathgo-logo-link">
            <span class="mathgo-logo-text">MathGo</span>
          </a>
        </nav>
      </div>

      <!-- Hero Section -->
      <div class="header-logging">
        <div class="left-logging-header" id="left-logging-header">
          <!-- Aquí puedes agregar una imagen para el héroe -->
          <img src="./assets/images/duo-logo.png" alt="Math learning" style="max-width: 100%; height: auto;" />
        </div>
        <div class="right-logging-header">
          <h1 id="header-text"></h1>
          <p class="hero-subtitle" id="hero-subtitle"></p>
          <div class="right-logging-button-section">
            <div class="get-started-btn-div">
              <button class="logging-get-started-button button-div" onclick="getStartedButtonAnimation();" id="get-started-button">
                <span id="get-started-text"></span>
              </button>
            </div>
            <div class="already-have-account-btn-div">
              <button class="logging-already-have-account-button button-div" onclick="alreadyAccountButtonAnimation();" id="already-have-account-button">
                <span id="already-have-account-text"></span>
              </button>
            </div>
          </div>
          <p class="hero-stat" id="hero-stat"></p>
        </div>
      </div>
    </header>

    <!-- Secciones de características con imágenes estáticas -->
    <section class="duolingo-features">
      <!-- Feature 1: Aprende haciendo -->
      <section class="feature-class features-column">
        <div class="duolingo-features-text">
          <h2 class="duolingo-features-text-head" id="feature-head-1"></h2>
          <p class="duolingo-features-text-body">
            <span id="feature-body-1"></span>
          </p>
        </div>
        <div class="duolingo-feature-animation">
          <img src="./assets/images/math-learning.png" alt="Aprende haciendo" style="width: 100%; height: auto; border-radius: 20px;" />
        </div>
      </section>

      <!-- Feature 2: Mantén la motivación -->
      <section class="feature-class features-column">
        <div class="duolingo-features-text">
          <h2 class="duolingo-features-text-head" id="feature-head-2"></h2>
          <p class="duolingo-features-text-body">
            <span id="feature-body-2"></span>
          </p>
        </div>
        <div class="duolingo-feature-animation">
          <img src="./assets/images/math-motivation.png" alt="Mantén la motivación" style="width: 100%; height: auto; border-radius: 20px;" />
        </div>
      </section>

      <!-- Feature 3: Aprendizaje personalizado -->
      <section class="feature-class features-column-reverse">
        <div class="duolingo-feature-animation">
          <img src="./assets/images/math-personalized.png" alt="Aprendizaje personalizado" style="width: 100%; height: auto; border-radius: 20px;" />
        </div>
        <div class="duolingo-features-text">
          <h2 class="duolingo-features-text-head" id="feature-head-3"></h2>
          <p class="duolingo-features-text-body">
            <span id="feature-body-3"></span>
          </p>
        </div>
      </section>
    </section>

  </body>
  <script src="./js/pointerpage.js"></script>
</html>
