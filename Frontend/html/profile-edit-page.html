<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Editar Perfil</title>
  <meta name="description" content="Edita tu información de perfil de MathGo." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="mg-layout-2col" id="mg-layout">
    <!-- Sidebar inyectado dinámicamente -->

    <main class="mg-main" id="mg-main">
      <div class="mg-card" style="max-width: 600px; margin: 40px auto; padding: var(--mg-space-6);">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-user-pen" style="color:var(--mg-primary);"></i> Editar Perfil
        </h2>
        
        <form id="edit-profile-form" style="display: flex; flex-direction: column; gap: 20px; margin-top: 24px;">
          <!-- Foto de perfil -->
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-weight: 800; font-size: 14px; color: var(--mg-text-2);">Imagen de perfil</label>
            <div style="display: flex; align-items: center; gap: 16px;">
              <!-- Avatar circular grande -->
              <div id="avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; background: var(--mg-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900;">
                ?
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
                <label class="mg-btn mg-btn-secondary mg-btn-sm" style="display: inline-block; cursor: pointer; text-align: center; width: fit-content; margin: 0;">
                  <i class="fa-solid fa-upload"></i> Seleccionar archivo
                  <input id="choose-file-input" type="file" accept="image/*" style="display: none;" />
                </label>
                <span id="selected-file-name" style="font-size: 12px; color: var(--mg-muted); font-weight: 700;">Ningún archivo seleccionado</span>
              </div>
            </div>
          </div>

          <!-- Nombre -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="name" style="font-weight: 800; font-size: 14px; color: var(--mg-text-2);">Nombre</label>
            <input name="name" class="mg-input" id="name" type="text" placeholder="Tu nombre" />
          </div>

          <!-- Correo (Deshabilitado, solo lectura) -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="email" style="font-weight: 800; font-size: 14px; color: var(--mg-text-2);">Correo electrónico</label>
            <input name="email" class="mg-input" id="email" type="text" disabled style="opacity: 0.6; cursor: not-allowed;" />
          </div>

          <!-- Botones de Acción -->
          <div style="display: flex; gap: 12px; margin-top: 12px;">
            <button type="button" class="mg-btn mg-btn-secondary" id="go-back" style="flex: 1;">
              <i class="fa-solid fa-arrow-left"></i> Volver
            </button>
            <button type="submit" class="mg-btn mg-btn-success" id="save-changes" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span id="save-changes-span"><i class="fa-solid fa-floppy-disk"></i> Guardar cambios</span>
              <div class="spinner" id="save-spinner" style="display: none; width: 18px; height: 18px; border-width: 2px;"></div>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <script type="module" src="../js/profile-edit-page.js"></script>
</body>
</html>
