<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Tienda</title>
  <meta name="description" content="Gasta tus gemas en la Tienda de MathGo." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
  <style>
    .shop-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .shop-header h1 {
      font-size: 24px;
      font-weight: 900;
      color: var(--mg-text);
      margin: 0;
    }
    .shop-gems-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6,182,212,0.10);
      border: 1px solid rgba(6,182,212,0.25);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 16px;
      font-weight: 800;
      color: var(--mg-gems);
      margin-left: auto;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .shop-item-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 28px 20px 20px;
      text-align: center;
    }
    .shop-item-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(236,72,153,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--mg-hearts);
      flex-shrink: 0;
    }
    .shop-item-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--mg-text);
    }
    .shop-item-desc {
      font-size: 13px;
      color: var(--mg-muted);
      margin: 0;
      line-height: 1.5;
    }
    .shop-item-cost {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 800;
      color: var(--mg-gems);
    }
    .shop-item-cost i {
      font-size: 14px;
    }
    .shop-msg {
      font-size: 13px;
      font-weight: 700;
      min-height: 20px;
      text-align: center;
    }
    .shop-msg.error  { color: var(--mg-error, #ef4444); }
    .shop-msg.success { color: var(--mg-success, #22c55e); }
    .shop-item-icon--xp {
      background: rgba(250,204,21,0.12);
      color: var(--mg-xp);
    }
    .boost-status {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--mg-xp);
      background: rgba(250,204,21,0.10);
      border: 1px solid rgba(250,204,21,0.30);
      border-radius: 8px;
      padding: 6px 12px;
      width: 100%;
      justify-content: center;
    }
    .boost-timer {
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .shop-section-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--mg-text);
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .banner-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 16px 16px;
      text-align: center;
    }
    .banner-preview {
      width: 100%;
      height: 64px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .banner-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--mg-text);
    }
    .banner-cost {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 800;
      color: var(--mg-gems);
    }
    .banner-equipped-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: var(--mg-success);
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 999px;
      padding: 4px 12px;
    }
    .banner-msg {
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
      text-align: center;
    }
    .banner-msg.error   { color: var(--mg-danger, #ef4444); }
    .banner-msg.success { color: var(--mg-success, #22c55e); }
  </style>
</head>
<body>

  <div class="mg-layout" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">

      <div class="shop-header">
        <h1><i class="fa-solid fa-store" style="color:var(--mg-primary); margin-right:8px;"></i>Tienda</h1>
        <span class="shop-gems-badge">
          <i class="fa-solid fa-gem"></i>
          <span id="gems-count">–</span> gemas
        </span>
      </div>

      <div class="shop-grid">

        <!-- Card: +1 Vida -->
        <div class="mg-card shop-item-card">
          <div class="shop-item-icon">
            <i class="fa-solid fa-heart"></i>
          </div>
          <div class="shop-item-name">+1 Vida</div>
          <p class="shop-item-desc">Recupera una vida para seguir practicando sin esperar.</p>
          <div class="shop-item-cost">
            <i class="fa-solid fa-gem"></i> 100
          </div>
          <div class="shop-msg" id="buy-life-msg"></div>
          <button class="mg-btn mg-btn-primary" id="btn-buy-life" style="width:100%;">
            <i class="fa-solid fa-cart-shopping"></i> Comprar
          </button>
        </div>

        <!-- Card: Boost XP x2 -->
        <div class="mg-card shop-item-card">
          <div class="shop-item-icon shop-item-icon--xp">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div class="shop-item-name">Boost XP x2</div>
          <p class="shop-item-desc">Duplica el XP que ganas por 30 minutos.</p>
          <div class="shop-item-cost">
            <i class="fa-solid fa-gem"></i> 50
          </div>
          <div class="boost-status" id="boost-status">
            <i class="fa-solid fa-bolt"></i>
            Boost activo: <span class="boost-timer" id="boost-timer">--:--</span>
          </div>
          <div class="shop-msg" id="buy-boost-msg"></div>
          <button class="mg-btn mg-btn-primary" id="btn-buy-boost" style="width:100%;">
            <i class="fa-solid fa-cart-shopping"></i> Comprar
          </button>
        </div>

      </div>

      <!-- Sección: Personalización (Banners) -->
      <div class="shop-section-title">
        <i class="fa-solid fa-palette" style="color:var(--mg-primary);"></i> Personalización
      </div>
      <div class="mg-card" style="padding: 20px;">
        <div class="banner-grid" id="banner-grid">
          <!-- Renderizado por JS -->
        </div>
      </div>

    </main>
  </div>

  <script type="module">
    import { requireAuth } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { getProfile, buyLife, buyXpBoost } from '../js/services/api.js';
    import { auth, db } from '../js/firebaseConfig.js';
    import {
      doc, getDoc, runTransaction, updateDoc, arrayUnion
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
    import { BANNER_CATALOG } from '../js/banner-catalog.js';

    const MAX_LIVES = 15;
    let boostTimer = null;

    function formatCountdown(endDate) {
      const remaining = Math.max(0, endDate - Date.now());
      const totalSecs = Math.floor(remaining / 1000);
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startBoostCountdown(endDate) {
      const statusEl = document.getElementById('boost-status');
      const timerEl  = document.getElementById('boost-timer');
      if (!statusEl || !timerEl) return;

      if (boostTimer) clearInterval(boostTimer);

      function tick() {
        if (endDate <= Date.now()) {
          clearInterval(boostTimer);
          statusEl.style.display = 'none';
          return;
        }
        timerEl.textContent = formatCountdown(endDate);
      }

      tick();
      statusEl.style.display = 'flex';
      boostTimer = setInterval(tick, 1000);
    }

    // Estado compartido de banners
    let bannerState = { owned: [], equipped: null };

    function renderBanners() {
      const grid = document.getElementById('banner-grid');
      grid.innerHTML = BANNER_CATALOG.map(b => {
        const isOwned    = bannerState.owned.includes(b.id);
        const isEquipped = bannerState.equipped === b.id;

        let actionHtml;
        if (!isOwned) {
          actionHtml = `
            <button class="mg-btn mg-btn-primary" style="width:100%; font-size:13px;"
              data-banner-buy="${b.id}">
              <i class="fa-solid fa-cart-shopping"></i> Comprar
            </button>`;
        } else if (isEquipped) {
          actionHtml = `
            <span class="banner-equipped-badge">
              <i class="fa-solid fa-check"></i> Equipado
            </span>
            <button class="mg-btn" style="width:100%; font-size:13px; background:rgba(0,0,0,0.06); color:var(--mg-muted);"
              data-banner-unequip="${b.id}">
              <i class="fa-solid fa-xmark"></i> Quitar
            </button>`;
        } else {
          actionHtml = `
            <button class="mg-btn mg-btn-primary" style="width:100%; font-size:13px; background:var(--mg-success);"
              data-banner-equip="${b.id}">
              <i class="fa-solid fa-image"></i> Equipar
            </button>`;
        }

        return `
          <div class="mg-card banner-card">
            <div class="banner-preview" style="background:${b.gradient};"></div>
            <div class="banner-name">${b.name}</div>
            ${!isOwned ? `<div class="banner-cost"><i class="fa-solid fa-gem"></i> ${b.cost}</div>` : ''}
            <div class="banner-msg" id="banner-msg-${b.id}"></div>
            ${actionHtml}
          </div>`;
      }).join('');

      // Botones comprar
      grid.querySelectorAll('[data-banner-buy]').forEach(btn => {
        btn.addEventListener('click', () => buyBanner(btn.dataset.bannerBuy, btn));
      });
      // Botones equipar
      grid.querySelectorAll('[data-banner-equip]').forEach(btn => {
        btn.addEventListener('click', () => equipBanner(btn.dataset.bannerEquip));
      });
      // Botones quitar
      grid.querySelectorAll('[data-banner-unequip]').forEach(btn => {
        btn.addEventListener('click', () => unequipBanner());
      });
    }

    async function buyBanner(bannerId, btn) {
      const uid = auth.currentUser?.uid;
      if (!uid) return;
      const catalog = BANNER_CATALOG.find(b => b.id === bannerId);
      if (!catalog) return;

      const msgEl = document.getElementById(`banner-msg-${bannerId}`);
      btn.disabled = true;
      msgEl.textContent = '';
      msgEl.className = 'banner-msg';

      try {
        let newGems;
        await runTransaction(db, async tx => {
          const progressRef = doc(db, 'mathgo_progress', uid);
          const userRef     = doc(db, 'users', uid);

          const [progressSnap, userSnap] = await Promise.all([tx.get(progressRef), tx.get(userRef)]);

          const gems      = progressSnap.exists() ? (progressSnap.data().gems ?? 0) : 0;
          const owned     = userSnap.exists() ? (userSnap.data().ownedBanners ?? []) : [];

          if (owned.includes(bannerId)) throw new Error('Ya tienes este banner.');
          if (gems < catalog.cost) throw new Error('Gemas insuficientes.');

          newGems = gems - catalog.cost;
          tx.update(progressRef, { gems: newGems });
          tx.update(userRef, { ownedBanners: arrayUnion(bannerId) });
        });

        document.getElementById('gems-count').textContent = newGems;
        bannerState.owned = [...bannerState.owned, bannerId];
        renderBanners();
        const newMsg = document.getElementById(`banner-msg-${bannerId}`);
        if (newMsg) { newMsg.textContent = '¡Banner desbloqueado!'; newMsg.className = 'banner-msg success'; }
      } catch (err) {
        msgEl.textContent = err.message || 'Error al comprar.';
        msgEl.className = 'banner-msg error';
        btn.disabled = false;
      }
    }

    async function equipBanner(bannerId) {
      const uid = auth.currentUser?.uid;
      if (!uid) return;
      await updateDoc(doc(db, 'users', uid), { equippedBanner: bannerId });
      bannerState.equipped = bannerId;
      renderBanners();
    }

    async function unequipBanner() {
      const uid = auth.currentUser?.uid;
      if (!uid) return;
      await updateDoc(doc(db, 'users', uid), { equippedBanner: null });
      bannerState.equipped = null;
      renderBanners();
    }

    async function load() {
      await initSidebar('tienda');

      const { data: profile } = await getProfile();
      const gemsEl = document.getElementById('gems-count');
      if (profile) {
        gemsEl.textContent = profile.gems ?? 0;
      }

      // Leer xpBoostUntil y estado de banners desde Firestore
      const uid = auth.currentUser?.uid;
      if (uid) {
        const [progressSnap, userSnap] = await Promise.all([
          getDoc(doc(db, 'mathgo_progress', uid)),
          getDoc(doc(db, 'users', uid)),
        ]);

        if (progressSnap.exists()) {
          const boostUntil = progressSnap.data().xpBoostUntil?.toDate?.();
          if (boostUntil && boostUntil > new Date()) {
            startBoostCountdown(boostUntil);
          }
        }

        if (userSnap.exists()) {
          bannerState.owned    = userSnap.data().ownedBanners  ?? [];
          bannerState.equipped = userSnap.data().equippedBanner ?? null;
        }
      }

      renderBanners();

      // Botón: +1 Vida
      document.getElementById('btn-buy-life').addEventListener('click', async () => {
        const btn   = document.getElementById('btn-buy-life');
        const msgEl = document.getElementById('buy-life-msg');

        btn.disabled = true;
        msgEl.textContent = '';
        msgEl.className = 'shop-msg';

        const { data, error } = await buyLife();

        if (error) {
          msgEl.textContent = error;
          msgEl.className = 'shop-msg error';
          btn.disabled = false;
          return;
        }

        gemsEl.textContent = data.gems;
        msgEl.textContent = `+1 vida. Ahora tienes ${data.lives} / ${MAX_LIVES}.`;
        msgEl.className = 'shop-msg success';
        btn.disabled = false;

        const sbHearts = document.getElementById('sb-hearts');
        if (sbHearts) sbHearts.textContent = data.lives;
      });

      // Botón: Boost XP x2
      document.getElementById('btn-buy-boost').addEventListener('click', async () => {
        const btn   = document.getElementById('btn-buy-boost');
        const msgEl = document.getElementById('buy-boost-msg');

        btn.disabled = true;
        msgEl.textContent = '';
        msgEl.className = 'shop-msg';

        const { data, error } = await buyXpBoost();

        if (error) {
          msgEl.textContent = error;
          msgEl.className = 'shop-msg error';
          btn.disabled = false;
          return;
        }

        gemsEl.textContent = data.gems;
        msgEl.textContent = 'Boost activado por 30 minutos.';
        msgEl.className = 'shop-msg success';
        btn.disabled = false;

        startBoostCountdown(new Date(data.xpBoostUntil));
      });
    }

    requireAuth(false).then(() => load());
  </script>
</body>
</html>
