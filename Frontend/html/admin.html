<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Panel Admin</title>
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
  <style>
    /* ── Modal de gestión de usuario ── */
    #manage-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 300;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .manage-modal-box {
      width: 100%; max-width: 520px;
      max-height: 92vh; overflow-y: auto;
      border-radius: 22px !important;
      padding: 0 !important;
      box-shadow: 0 20px 60px rgba(0,0,0,.28) !important;
    }
    .manage-modal-header {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--mg-border);
      position: sticky; top: 0;
      background: var(--mg-surface); z-index: 1;
      border-radius: 22px 22px 0 0;
    }
    .manage-modal-user { flex: 1; min-width: 0; }
    .manage-modal-user-name {
      font-weight: 900; font-size: 16px; color: var(--mg-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .manage-modal-user-email {
      font-size: 12px; color: var(--mg-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .manage-modal-close {
      background: var(--mg-surface-2); border: 1px solid var(--mg-border);
      color: var(--mg-muted); width: 34px; height: 34px;
      border-radius: 50%; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--mg-transition); flex-shrink: 0;
    }
    .manage-modal-close:hover { background: var(--mg-border); color: var(--mg-text); }
    .manage-modal-body { padding: 0 24px; }
    .manage-section {
      padding: 18px 0;
      border-bottom: 1px solid var(--mg-border-soft);
    }
    .manage-section:last-child { border-bottom: none; }
    .manage-section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--mg-muted); margin-bottom: 12px;
    }
    .manage-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .manage-input-num {
      width: 72px; padding: 8px 10px;
      border: 1.5px solid var(--mg-border); border-radius: 10px;
      font-family: var(--mg-font); font-size: 14px; font-weight: 700;
      color: var(--mg-text); background: var(--mg-surface);
      outline: none; transition: border-color var(--mg-transition);
    }
    .manage-input-num:focus { border-color: var(--mg-primary); box-shadow: 0 0 0 3px var(--mg-primary-glow); }
    .manage-inline-label {
      font-size: 12px; font-weight: 700; color: var(--mg-muted); white-space: nowrap;
    }
    .manage-select {
      padding: 8px 12px;
      border: 1.5px solid var(--mg-border); border-radius: var(--mg-radius);
      font-family: var(--mg-font); font-size: 13px; font-weight: 700;
      color: var(--mg-text); background: var(--mg-surface);
      outline: none; cursor: pointer;
      transition: border-color var(--mg-transition);
    }
    .manage-select:focus { border-color: var(--mg-primary); }
    .manage-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 15px;
      border-radius: var(--mg-radius); border: none;
      font-family: var(--mg-font); font-size: 13px; font-weight: 800;
      cursor: pointer; transition: all var(--mg-transition); white-space: nowrap;
    }
    .manage-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .manage-btn-danger {
      background: rgba(239,68,68,0.09); color: var(--mg-danger);
      border: 1.5px solid rgba(239,68,68,0.22);
    }
    .manage-btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.17); }
    .manage-btn-primary {
      background: var(--mg-primary); color: #fff;
      box-shadow: 0 3px 0 var(--mg-primary-dark);
    }
    .manage-btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    .manage-btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--mg-primary-dark); }
    .manage-btn-gem {
      background: rgba(6,182,212,0.09); color: var(--mg-gems);
      border: 1.5px solid rgba(6,182,212,0.22);
    }
    .manage-btn-gem:hover:not(:disabled) { background: rgba(6,182,212,0.17); }
    .manage-modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--mg-border);
      display: flex; justify-content: flex-end;
      border-radius: 0 0 22px 22px;
    }
    /* Botón de gestión en la tabla */
    .btn-manage {
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 13px;
      border: 1.5px solid var(--mg-border);
      background: var(--mg-surface-2);
      color: var(--mg-muted);
      cursor: pointer;
      transition: all var(--mg-transition);
    }
    .btn-manage:hover {
      background: rgba(90,18,54,0.08);
      color: var(--mg-primary);
      border-color: rgba(90,18,54,0.2);
    }
  </style>
</head>
<body>

  <div class="mg-layout-2col" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">

      <!-- Hero -->
      <div class="admin-hero">
        <div class="admin-hero-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div>
          <h1>Panel de Administrador</h1>
          <p>Gestión de usuarios y estadísticas globales de MathGo</p>
        </div>
      </div>

      <!-- 1. Estadísticas generales -->
      <div class="admin-section-hd">
        <i class="fa-solid fa-chart-bar" style="color:var(--mg-primary);font-size:20px;"></i>
        <h2>Estadísticas generales</h2>
      </div>
      <div class="admin-stats-grid" id="admin-stats">
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
        <div class="admin-stat-card mg-skeleton" style="height:110px;"></div>
      </div>

      <!-- 2. Gestión de usuarios -->
      <div class="admin-section-hd mg-mb-4">
        <i class="fa-solid fa-users" style="color:var(--mg-primary);font-size:20px;"></i>
        <h2>Gestión de usuarios</h2>
      </div>
      <div class="mg-card mg-mb-8" id="users-card">
        <div class="mg-skeleton" style="height:220px;border-radius:12px;"></div>
      </div>

      <!-- 3. Progreso por mundo -->
      <div class="admin-section-hd mg-mb-4">
        <i class="fa-solid fa-map" style="color:var(--mg-primary);font-size:20px;"></i>
        <h2>Progreso por mundo</h2>
      </div>
      <div class="mg-card" id="worlds-card">
        <div class="mg-skeleton" style="height:200px;border-radius:12px;"></div>
      </div>

    </main>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <!-- ── Modal de gestión de usuario ── -->
  <div id="manage-modal" class="mg-hidden" onclick="if(event.target===this)window.closeManageModal()">
    <div class="manage-modal-box mg-card">

      <div class="manage-modal-header">
        <div class="mg-avatar" id="manage-avatar" style="width:40px;height:40px;font-size:15px;flex-shrink:0;"></div>
        <div class="manage-modal-user">
          <div class="manage-modal-user-name" id="manage-name"></div>
          <div class="manage-modal-user-email" id="manage-email"></div>
        </div>
        <button class="manage-modal-close" onclick="window.closeManageModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="manage-modal-body">

        <!-- Vidas -->
        <div class="manage-section">
          <div class="manage-section-title">
            <i class="fa-solid fa-heart" style="color:var(--mg-hearts);"></i> Vidas
          </div>
          <div class="manage-row">
            <button class="manage-btn manage-btn-danger" onclick="window.adminResetLives(this)">
              <i class="fa-solid fa-rotate-left"></i> Resetear vidas
            </button>
            <span class="manage-inline-label">Asignar:</span>
            <input type="number" id="assign-lives-input" class="manage-input-num" min="1" max="15" value="5" />
            <button class="manage-btn manage-btn-primary" onclick="window.adminAssignLives(this)">
              Aplicar
            </button>
          </div>
        </div>

        <!-- XP -->
        <div class="manage-section">
          <div class="manage-section-title">
            <i class="fa-solid fa-bolt" style="color:var(--mg-xp);"></i> XP
          </div>
          <div class="manage-row">
            <button class="manage-btn manage-btn-danger" onclick="window.adminResetXp(this)">
              <i class="fa-solid fa-rotate-left"></i> Resetear XP
            </button>
          </div>
        </div>

        <!-- Gemas -->
        <div class="manage-section">
          <div class="manage-section-title">
            <i class="fa-solid fa-gem" style="color:var(--mg-gems);"></i> Gemas
          </div>
          <div class="manage-row">
            <span class="manage-inline-label">Agregar:</span>
            <input type="number" id="add-gems-input" class="manage-input-num" min="1" value="10" />
            <button class="manage-btn manage-btn-gem" onclick="window.adminAddGems(this)">
              <i class="fa-solid fa-plus"></i> Agregar
            </button>
            <span class="manage-inline-label" style="margin-left:4px;">Quitar:</span>
            <input type="number" id="remove-gems-input" class="manage-input-num" min="1" value="10" />
            <button class="manage-btn manage-btn-danger" onclick="window.adminRemoveGems(this)">
              <i class="fa-solid fa-minus"></i> Quitar
            </button>
          </div>
        </div>

        <!-- Racha -->
        <div class="manage-section">
          <div class="manage-section-title">
            <i class="fa-solid fa-fire" style="color:var(--mg-streak);"></i> Racha
          </div>
          <div class="manage-row">
            <button class="manage-btn manage-btn-danger" onclick="window.adminResetStreak(this)">
              <i class="fa-solid fa-rotate-left"></i> Resetear racha
            </button>
          </div>
        </div>

        <!-- Progreso de mundo -->
        <div class="manage-section">
          <div class="manage-section-title">
            <i class="fa-solid fa-map" style="color:var(--mg-primary);"></i> Progreso de mundo
          </div>
          <div class="manage-row">
            <select id="reset-world-select" class="manage-select">
              <option value="1">Mundo 1 — Las Bases del Álgebra</option>
              <option value="2">Mundo 2 — Números Reales</option>
              <option value="3">Mundo 3 — Funciones y Ecuaciones Lineales</option>
              <option value="4">Mundo 4 — Funciones Cuadráticas</option>
              <option value="5">Mundo 5 — Matrices y Sistemas Avanzados</option>
              <option value="6">Mundo 6 — Números Complejos y Vectores</option>
            </select>
            <button class="manage-btn manage-btn-danger" onclick="window.adminResetWorld(this)">
              <i class="fa-solid fa-rotate-left"></i> Resetear mundo
            </button>
          </div>
        </div>

      </div>

      <div class="manage-modal-footer">
        <button class="mg-btn mg-btn-secondary mg-btn-sm" onclick="window.closeManageModal()">
          <i class="fa-solid fa-xmark"></i> Cerrar
        </button>
      </div>

    </div>
  </div>

  <script type="module">
    import { requireAuth, getInitials, showToast } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { db } from '../js/firebaseConfig.js';
    import {
      doc, getDoc, setDoc,
      collection, getDocs,
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    const WORLDS = [
      { id: '1', title: 'Las Bases del Álgebra',           icon: 'fa-solid fa-drafting-compass' },
      { id: '2', title: 'Números Reales',                  icon: 'fa-solid fa-infinity' },
      { id: '3', title: 'Funciones y Ecuaciones Lineales', icon: 'fa-solid fa-chart-simple' },
      { id: '4', title: 'Funciones Cuadráticas',           icon: 'fa-solid fa-wave-square' },
      { id: '5', title: 'Matrices y Sistemas Avanzados',   icon: 'fa-solid fa-table-cells' },
      { id: '6', title: 'Números Complejos y Vectores',    icon: 'fa-solid fa-atom' },
    ];

    let cachedUsers = [];
    let cachedProgressMap = {};
    let currentUser = null;
    let managedUid = null;

    // ── Guard + carga ──────────────────────────────────────
    async function loadAdmin(user) {
      const selfSnap = await getDoc(doc(db, 'users', user.uid));
      if (!selfSnap.exists() || selfSnap.data().role !== 'admin') {
        window.location.replace('learn.html');
        return;
      }

      await initSidebar('admin');

      const [usersSnap, progressSnap, attemptsSnap] = await Promise.all([
        getDocs(collection(db, 'users')),
        getDocs(collection(db, 'mathgo_progress')),
        getDocs(collection(db, 'attempts')).catch(() => ({ forEach: () => {} })),
      ]);

      cachedUsers = [];
      usersSnap.forEach(d => cachedUsers.push({ uid: d.id, ...d.data() }));
      progressSnap.forEach(d => { cachedProgressMap[d.id] = d.data(); });

      const cachedAttempts = [];
      attemptsSnap.forEach(d => cachedAttempts.push(d.data()));

      let totalLevels = 0;
      let totalXpSum  = 0;
      let topUser     = null;

      cachedUsers.forEach(u => {
        const p   = cachedProgressMap[u.uid] ?? {};
        const xp  = p.totalXp ?? u.totalXp ?? 0;
        totalXpSum += xp;
        if (!topUser || xp > topUser.xp) topUser = { ...u, xp };
        Object.values(p.worlds ?? {}).forEach(w => {
          totalLevels += (w.levelsCompleted ?? []).length;
        });
      });

      const avgXp          = cachedUsers.length > 0 ? Math.round(totalXpSum / cachedUsers.length) : 0;
      const totalAttempts  = cachedAttempts.length;
      const correctAttempts = cachedAttempts.filter(a => a.isCorrect === true).length;
      const accuracy       = totalAttempts > 0
        ? (correctAttempts / totalAttempts * 100).toFixed(1) + '%'
        : '—';

      renderStats(cachedUsers.length, totalLevels, topUser, avgXp, totalAttempts, accuracy);
      renderUsers(cachedUsers, cachedProgressMap);
      renderWorlds(cachedUsers, cachedProgressMap);
    }

    // ── Sección 1: Estadísticas generales ─────────────────
    function renderStats(totalUsers, totalLevels, topUser, avgXp, totalAttempts, accuracy) {
      const topName = topUser
        ? (topUser.name || topUser.email?.split('@')[0] || '–').replace(/</g, '&lt;')
        : '–';
      document.getElementById('admin-stats').innerHTML = `
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-users" style="color:var(--mg-primary);"></i></div>
          <div class="admin-stat-value mg-text-primary">${totalUsers}</div>
          <div class="admin-stat-label">Usuarios registrados</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-circle-check" style="color:var(--mg-success);"></i></div>
          <div class="admin-stat-value" style="color:var(--mg-success);">${totalLevels}</div>
          <div class="admin-stat-label">Niveles completados</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-crown" style="color:var(--mg-xp);"></i></div>
          <div class="admin-stat-value mg-text-xp" style="font-size:16px;padding-top:4px;">${topName}</div>
          <div class="admin-stat-label">Mayor XP · ${topUser?.xp ?? 0} pts</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-bolt" style="color:var(--mg-xp);"></i></div>
          <div class="admin-stat-value mg-text-xp">${avgXp}</div>
          <div class="admin-stat-label">Promedio XP</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-bullseye" style="color:var(--mg-success);"></i></div>
          <div class="admin-stat-value" style="color:var(--mg-success);">${accuracy}</div>
          <div class="admin-stat-label">Precisión global</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon"><i class="fa-solid fa-list-check" style="color:var(--mg-primary);"></i></div>
          <div class="admin-stat-value mg-text-primary">${totalAttempts.toLocaleString('es-ES')}</div>
          <div class="admin-stat-label">Total de intentos</div>
        </div>
      `;
    }

    // ── Sección 2: Gestión de usuarios ────────────────────
    function renderUsers(users, progressMap) {
      if (!users.length) {
        document.getElementById('users-card').innerHTML = `
          <div class="mg-empty">
            <div class="mg-empty-icon"><i class="fa-solid fa-users"></i></div>
            <div class="mg-empty-title">Sin usuarios</div>
          </div>`;
        return;
      }

      const rows = users.map(u => {
        const p    = progressMap[u.uid] ?? {};
        const xp   = p.totalXp ?? 0;
        const racha = p.dailyStreak ?? 0;
        const role  = u.role ?? 'student';
        const nivel    = Math.floor(xp / 100) + 1;
        const initials = getInitials(u.name || u.email);
        const safeName = (u.name  || '–').replace(/</g,'&lt;');
        const safeMail = (u.email || '–').replace(/</g,'&lt;');

        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="mg-avatar" style="width:34px;height:34px;font-size:13px;">${initials}</div>
                <div>
                  <div style="font-weight:700;color:var(--mg-text);">${safeName}</div>
                  <div style="font-size:12px;color:var(--mg-muted);">${safeMail}</div>
                </div>
              </div>
            </td>
            <td style="font-weight:700;">Nv. ${nivel}</td>
            <td><span class="mg-badge mg-badge-xp"><i class="fa-solid fa-bolt"></i> ${xp}</span></td>
            <td><span class="mg-badge mg-badge-streak"><i class="fa-solid fa-fire"></i> ${racha}</span></td>
            <td>
              <select class="role-select ${role}" onchange="window.changeRole('${u.uid}', this)">
                <option value="student" ${role === 'student' ? 'selected' : ''}>Estudiante</option>
                <option value="teacher" ${role === 'teacher' ? 'selected' : ''}>Profesor</option>
                <option value="admin"   ${role === 'admin'   ? 'selected' : ''}>Admin</option>
              </select>
            </td>
            <td style="text-align:center;">
              <button class="btn-manage" title="Gestionar usuario" onclick="window.openManageModal('${u.uid}')">
                <i class="fa-solid fa-sliders"></i>
              </button>
            </td>
          </tr>`;
      }).join('');

      document.getElementById('users-card').innerHTML = `
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Nivel</th>
                <th>XP</th>
                <th>Racha</th>
                <th>Rol</th>
                <th style="text-align:center;">Acciones</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // ── Sección 3: Progreso por mundo ─────────────────────
    function renderWorlds(users, progressMap) {
      const total = users.length;
      const rows = WORLDS.map(w => {
        const completed = users.filter(u =>
          progressMap[u.uid]?.worlds?.[w.id]?.allComplete === true
        ).length;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        return `
          <tr>
            <td style="width:36px;text-align:center;">
              <i class="${w.icon}" style="color:var(--mg-primary);font-size:18px;"></i>
            </td>
            <td style="font-weight:700;color:var(--mg-text);">Mundo ${w.id} — ${w.title}</td>
            <td style="text-align:center;width:80px;">
              <span class="mg-badge mg-badge-primary">${completed} / ${total}</span>
            </td>
            <td style="width:180px;">
              <div class="world-bar">
                <div class="world-bar-fill" style="width:${pct}%;"></div>
              </div>
            </td>
            <td style="font-weight:800;color:var(--mg-primary);text-align:right;width:48px;">${pct}%</td>
          </tr>`;
      }).join('');

      document.getElementById('worlds-card').innerHTML = `
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th></th>
                <th>Mundo</th>
                <th style="text-align:center;">Completaron</th>
                <th>Progreso</th>
                <th style="text-align:right;">%</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // ── Cambio de rol ─────────────────────────────────────
    const ROLE_LABELS = { student: 'Estudiante', teacher: 'Profesor', admin: 'Admin' };

    async function changeRole(uid, selectEl) {
      const newRole = selectEl.value;
      const cached  = cachedUsers.find(u => u.uid === uid);
      const oldRole = cached?.role ?? 'student';

      if (newRole === oldRole) return;

      if (uid === currentUser?.uid && newRole !== 'admin') {
        const ok = confirm(
          `Estás cambiando tu propio rol a "${ROLE_LABELS[newRole]}". Perderás acceso de administrador. ¿Continuar?`
        );
        if (!ok) { selectEl.value = oldRole; return; }
      }

      selectEl.disabled = true;
      try {
        await setDoc(doc(db, 'users', uid), { role: newRole }, { merge: true });
        const idx = cachedUsers.findIndex(u => u.uid === uid);
        if (idx !== -1) cachedUsers[idx] = { ...cachedUsers[idx], role: newRole };
        renderUsers(cachedUsers, cachedProgressMap);
        showToast(`Rol actualizado a "${ROLE_LABELS[newRole]}"`, 'success');
      } catch {
        showToast('Error al cambiar el rol', 'error');
        selectEl.value = oldRole;
        selectEl.disabled = false;
      }
    }

    // ── Modal: abrir / cerrar ──────────────────────────────
    function openManageModal(uid) {
      managedUid = uid;
      const user = cachedUsers.find(u => u.uid === uid);
      if (!user) return;

      document.getElementById('manage-avatar').textContent = getInitials(user.name || user.email);
      document.getElementById('manage-name').textContent  = user.name  || '–';
      document.getElementById('manage-email').textContent = user.email || '–';

      document.getElementById('manage-modal').classList.remove('mg-hidden');
    }

    function closeManageModal() {
      document.getElementById('manage-modal').classList.add('mg-hidden');
      managedUid = null;
    }

    // ── Helpers ───────────────────────────────────────────
    function managedUserName() {
      const u = cachedUsers.find(u => u.uid === managedUid);
      return u?.name || u?.email || managedUid;
    }

    async function writeProgress(data, btn) {
      btn.disabled = true;
      try {
        await setDoc(doc(db, 'mathgo_progress', managedUid), data, { merge: true });
        cachedProgressMap[managedUid] = { ...(cachedProgressMap[managedUid] ?? {}), ...data };
        return true;
      } catch (e) {
        console.error(e);
        showToast('Error al guardar cambios', 'error');
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    // ── Vidas ─────────────────────────────────────────────
    async function adminResetLives(btn) {
      if (!confirm(`¿Resetear las vidas de ${managedUserName()} a 15?`)) return;
      const ok = await writeProgress({ lives: 15, lastLifeLostAt: null }, btn);
      if (ok) { renderUsers(cachedUsers, cachedProgressMap); showToast('Vidas reseteadas a 15', 'success'); }
    }

    async function adminAssignLives(btn) {
      const n = parseInt(document.getElementById('assign-lives-input').value, 10);
      if (isNaN(n) || n < 1 || n > 15) { showToast('Ingresa un valor entre 1 y 15', 'error'); return; }
      if (!confirm(`¿Asignar ${n} vidas a ${managedUserName()}?`)) return;
      const ok = await writeProgress({ lives: n }, btn);
      if (ok) { renderUsers(cachedUsers, cachedProgressMap); showToast(`${n} vidas asignadas`, 'success'); }
    }

    // ── XP ────────────────────────────────────────────────
    async function adminResetXp(btn) {
      if (!confirm(`¿Resetear el XP de ${managedUserName()} a 0? El nivel volverá a 1.`)) return;
      const ok = await writeProgress({ totalXp: 0 }, btn);
      if (ok) { renderUsers(cachedUsers, cachedProgressMap); showToast('XP reseteado a 0', 'success'); }
    }

    // ── Gemas ─────────────────────────────────────────────
    async function adminAddGems(btn) {
      const n = parseInt(document.getElementById('add-gems-input').value, 10);
      if (isNaN(n) || n < 1) { showToast('Ingresa un número mayor a 0', 'error'); return; }
      const currentGems = cachedProgressMap[managedUid]?.gems ?? 0;
      const newGems = currentGems + n;
      if (!confirm(`¿Agregar ${n} gemas a ${managedUserName()}? (${currentGems} → ${newGems})`)) return;
      const ok = await writeProgress({ gems: newGems }, btn);
      if (ok) showToast(`+${n} gemas agregadas`, 'success');
    }

    async function adminRemoveGems(btn) {
      const n = parseInt(document.getElementById('remove-gems-input').value, 10);
      if (isNaN(n) || n < 1) { showToast('Ingresa un número mayor a 0', 'error'); return; }
      const currentGems = cachedProgressMap[managedUid]?.gems ?? 0;
      const newGems = Math.max(0, currentGems - n);
      if (!confirm(`¿Quitar ${n} gemas a ${managedUserName()}? (${currentGems} → ${newGems})`)) return;
      const ok = await writeProgress({ gems: newGems }, btn);
      if (ok) showToast(`-${n} gemas quitadas`, 'success');
    }

    // ── Racha ─────────────────────────────────────────────
    async function adminResetStreak(btn) {
      if (!confirm(`¿Resetear la racha de ${managedUserName()} a 0?`)) return;
      const ok = await writeProgress({ dailyStreak: 0, lastActiveDate: null }, btn);
      if (ok) { renderUsers(cachedUsers, cachedProgressMap); showToast('Racha reseteada a 0', 'success'); }
    }

    // ── Progreso de mundo ─────────────────────────────────
    async function adminResetWorld(btn) {
      const worldId = document.getElementById('reset-world-select').value;
      if (!confirm(`¿Resetear el progreso del Mundo ${worldId} de ${managedUserName()}? Esta acción no se puede deshacer.`)) return;

      const currentWorlds = { ...(cachedProgressMap[managedUid]?.worlds ?? {}) };
      currentWorlds[worldId] = {
        ...(currentWorlds[worldId] ?? {}),
        levelsCompleted: [],
        allComplete: false,
        finalExam: { attempts: 0, score: 0, passed: false },
      };

      btn.disabled = true;
      try {
        await setDoc(doc(db, 'mathgo_progress', managedUid), { worlds: currentWorlds }, { merge: true });
        cachedProgressMap[managedUid] = { ...(cachedProgressMap[managedUid] ?? {}), worlds: currentWorlds };
        renderWorlds(cachedUsers, cachedProgressMap);
        showToast(`Mundo ${worldId} reseteado`, 'success');
      } catch (e) {
        console.error(e);
        showToast('Error al resetear mundo', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // ── Exponer al DOM (onclick handlers) ─────────────────
    window.changeRole       = changeRole;
    window.openManageModal  = openManageModal;
    window.closeManageModal = closeManageModal;
    window.adminResetLives  = adminResetLives;
    window.adminAssignLives = adminAssignLives;
    window.adminResetXp     = adminResetXp;
    window.adminAddGems     = adminAddGems;
    window.adminRemoveGems  = adminRemoveGems;
    window.adminResetStreak = adminResetStreak;
    window.adminResetWorld  = adminResetWorld;

    requireAuth(false).then(user => { currentUser = user; loadAdmin(user); });
  </script>
</body>
</html>
