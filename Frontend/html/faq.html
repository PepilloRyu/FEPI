<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Ayuda y FAQ</title>
  <meta name="description" content="Preguntas frecuentes y ayuda sobre MathGo." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="mg-layout-2col" id="mg-layout">
    <!-- Sidebar inyectado dinámicamente -->

    <main class="mg-main" id="mg-main">
      <div class="faq-wrapper">
        <div class="faq-title-container">
          <h1>Preguntas Frecuentes</h1>
          <p>Todo lo que necesitas saber sobre MathGo y el aprendizaje de álgebra</p>
        </div>

        <div id="faq-content-list">
          <!-- Categorías y preguntas inyectadas por JS -->
          <div class="mg-skeleton" style="height: 120px; border-radius: 18px; margin-bottom: 16px;"></div>
          <div class="mg-skeleton" style="height: 120px; border-radius: 18px; margin-bottom: 16px;"></div>
          <div class="mg-skeleton" style="height: 120px; border-radius: 18px;"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <script type="module">
    import { requireAuth } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    
    requireAuth(false).then(() => {
      initSidebar('faq');
    });
  </script>
  <script type="module" src="../js/faq.js"></script>
</body>
</html>
