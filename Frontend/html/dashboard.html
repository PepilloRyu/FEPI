<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Mi Progreso</title>
  <meta name="description" content="Dashboard academico de MathGo. Ve tu nivel, XP, estadisticas y misiones." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="mg-layout" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">

      <!-- Bienvenida personalizada -->
      <div class="dash-welcome" id="dash-welcome">
        <div class="dash-welcome-avatar" id="dash-avatar">?</div>
        <div>
          <h2 id="dash-greeting">¡Hola!</h2>
          <p id="dash-subtitle">Cargando tu progreso...</p>
        </div>
      </div>

      <!-- Metricas principales -->
      <div class="mg-stats-grid mg-mb-6" id="main-stats">
        <div class="mg-stat-box">
          <div style="font-size:24px; color:var(--mg-xp); margin-bottom:6px;"><i class="fa-solid fa-bolt"></i></div>
          <div class="mg-stat-value mg-text-xp" id="d-xp">–</div>
          <div class="mg-stat-label">XP Total</div>
        </div>
        <div class="mg-stat-box">
          <div style="font-size:24px; color:var(--mg-primary); margin-bottom:6px;"><i class="fa-solid fa-star"></i></div>
          <div class="mg-stat-value mg-text-primary" id="d-level">–</div>
          <div class="mg-stat-label">Nivel</div>
        </div>
        <div class="mg-stat-box">
          <div style="font-size:24px; color:var(--mg-gems); margin-bottom:6px;"><i class="fa-solid fa-gem"></i></div>
          <div class="mg-stat-value mg-text-gem" id="d-gems">–</div>
          <div class="mg-stat-label">Gemas</div>
        </div>
        <div class="mg-stat-box">
          <div id="d-accuracy-icon" style="font-size:24px; color:var(--mg-success); margin-bottom:6px;"><i class="fa-solid fa-bullseye"></i></div>
          <div class="mg-stat-value" id="d-accuracy" style="color: var(--mg-success);">–</div>
          <div class="mg-stat-label">Precisión global</div>
          <div id="d-accuracy-sub" style="font-size:11px; font-weight:700; color:var(--mg-muted); margin-top:3px;"></div>
        </div>
      </div>

      <div class="dash-grid-2">
        <!-- XP Ring -->
        <div class="mg-card" style="display:flex; align-items:center; justify-content:center; padding: 28px;">
          <div class="xp-ring-container">
            <div class="xp-ring" id="xp-ring">
              <div class="xp-ring-inner">
                <div class="xp-ring-value" id="xp-ring-val">0</div>
                <div class="xp-ring-label">/ 1000 XP</div>
              </div>
            </div>
            <div style="font-size:14px; font-weight:800; color: var(--mg-muted);">Progreso al siguiente nivel</div>
          </div>
        </div>

        <!-- Racha -->
        <div class="mg-card dash-streak-badge">
          <div class="dash-streak-fire"><i class="fa-solid fa-fire" style="color:var(--mg-streak);"></i></div>
          <div class="dash-streak-num" id="d-streak">0</div>
          <div class="dash-streak-text">días de racha</div>
          <span class="mg-badge mg-badge-streak" id="d-streak-msg">¡Sigue así!</span>
        </div>
      </div>

      <!-- Actividad semanal -->
      <div class="mg-card mg-mb-6">
        <h2 class="mg-card-title"><i class="fa-solid fa-calendar-days" style="color:var(--mg-primary);"></i> Actividad esta semana</h2>
        <div class="activity-chart" id="activity-chart">
          <!-- Se genera por JS -->
        </div>
      </div>

      <!-- Progreso por tema -->
      <div class="mg-card mg-mb-6">
        <h2 class="mg-card-title"><i class="fa-solid fa-book-open" style="color:var(--mg-primary);"></i> Dominio por mundo</h2>
        <div id="topics-list">
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:90%;height:36px;"></div>
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:90%;height:36px;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="width:90%;height:36px;"></div>
        </div>
      </div>

      <!-- Misiones activas -->
      <div class="mg-card mg-mb-4">
        <h2 class="mg-card-title"><i class="fa-solid fa-bullseye" style="color:var(--mg-primary);"></i> Misiones de hoy</h2>
        <div id="dash-missions">
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="height:60px;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="height:60px;"></div>
        </div>
      </div>

      <!-- Misiones semanales -->
      <div class="mg-card">
        <h2 class="mg-card-title"><i class="fa-solid fa-calendar-week" style="color:var(--mg-xp);"></i> Misiones de la semana</h2>
        <div id="dash-missions-weekly">
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="height:60px;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="height:60px;"></div>
        </div>
      </div>
    </main>

    <!-- Panel derecho -->
    <aside class="mg-right">
      <div class="mg-card mg-card-sm">
        <h2 class="mg-card-title" style="margin-bottom:12px;">
          <i class="fa-solid fa-fire" style="color:var(--mg-streak);"></i> Tu racha
        </h2>
        <div style="text-align:center; padding: 16px 0;">
          <div style="font-size:52px; color:var(--mg-streak); font-weight:900;" id="right-streak-num">–</div>
          <div style="font-size:13px; color:var(--mg-muted); font-weight:700;">días consecutivos</div>
        </div>
        <div class="mg-progress" style="margin-top:8px;">
          <div class="mg-progress-bar" id="right-streak-bar" style="width:0%; background: linear-gradient(90deg, var(--mg-streak), var(--mg-xp));"></div>
        </div>
        <div style="font-size:12px; color:var(--mg-muted); text-align:center; margin-top:6px;" id="right-streak-msg">¡Sigue así!</div>
      </div>

      <a href="learn.html" class="mg-btn mg-btn-success mg-btn-full" style="text-align:center; display:block;">
        <i class="fa-solid fa-rocket"></i> Ir a aprender
      </a>
    </aside>
  </div>

  <script type="module">
    import { requireAuth, getInitials, showToast, animateProgress } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { getDashboard, getMissions, getAnalytics } from '../js/services/api.js';
    import { db } from '../js/firebaseConfig.js';
    import { doc, getDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    const WORLD_NAMES = {
      '1': 'Las Bases del Álgebra',
      '2': 'Números Reales',
      '3': 'Funciones Lineales',
      '4': 'Funciones Cuadráticas',
      '5': 'Matrices y Sistemas',
      '6': 'Números Complejos',
    };

    const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    function renderActivityChart(weeklyXp = []) {
      const chart = document.getElementById('activity-chart');
      const today = new Date().getDay();
      const maxXp = Math.max(...weeklyXp, 50);

      chart.innerHTML = weeklyXp.map((xp, i) => {
        const h = Math.max(4, Math.round((xp / maxXp) * 72));
        const isToday = i === today;
        return `
          <div class="activity-bar-wrap">
            <div class="activity-bar ${isToday ? 'today' : ''}" style="height:${h}px;" title="${xp} XP"></div>
            <span class="activity-bar-label">${DAYS[i]}</span>
          </div>
        `;
      }).join('');
    }

    function renderTopics(worldsData) {
      const list = document.getElementById('topics-list');
      const items = Object.entries(WORLD_NAMES).map(([id, name]) => {
        const w = worldsData?.[id] ?? {};
        const completed = (w.levelsCompleted ?? []).length;
        const total = [3,5,4,4,4,4][parseInt(id)-1];
        const pct = Math.round((completed / total) * 100);
        return { name, pct, completed, total };
      });

      list.innerHTML = items.map(t => `
        <div class="topic-bar">
          <span class="topic-name">${t.name}</span>
          <div class="topic-progress mg-progress">
            <div class="mg-progress-bar success" style="width:${t.pct}%"></div>
          </div>
          <span class="topic-pct">${t.pct}%</span>
        </div>
      `).join('');
    }

    function missionCard(m) {
      const pct = Math.min(100, Math.round((m.progress / (m.target || 1)) * 100));
      const completedBadge = m.completed
        ? `<i class="fa-solid fa-circle-check" style="color:var(--mg-success);margin-left:6px;" title="Completada"></i>`
        : '';
      return `
        <div class="mg-mission-item${m.completed ? ' mg-mission-done' : ''}">
          <div class="mg-mission-header">
            <span class="mg-mission-title">${m.description || m.name}${completedBadge}</span>
            <span class="mg-mission-xp">+${m.xpReward ?? 0} XP</span>
          </div>
          <div class="mg-progress">
            <div class="mg-progress-bar xp" style="width:${pct}%"></div>
          </div>
          <div style="font-size:11px;color:var(--mg-muted);margin-top:3px;">${m.progress} / ${m.target}</div>
        </div>
      `;
    }

    function renderMissions(allMissions) {
      const daily = (allMissions ?? []).filter(m => m.type === 'daily');
      const weekly = (allMissions ?? []).filter(m => m.type === 'weekly');

      const dailyContainer = document.getElementById('dash-missions');
      if (!daily.length) {
        dailyContainer.innerHTML = `<div class="mg-empty" style="padding:16px 0;">
          <div class="mg-empty-icon" style="color:var(--mg-muted-2); font-size:32px;"><i class="fa-solid fa-bullseye"></i></div>
          <div class="mg-empty-text">No hay misiones diarias activas</div>
        </div>`;
      } else {
        dailyContainer.innerHTML = daily.map(missionCard).join('');
      }

      const weeklyContainer = document.getElementById('dash-missions-weekly');
      if (!weekly.length) {
        weeklyContainer.innerHTML = `<div class="mg-empty" style="padding:16px 0;">
          <div class="mg-empty-icon" style="color:var(--mg-muted-2); font-size:32px;"><i class="fa-solid fa-calendar-week"></i></div>
          <div class="mg-empty-text">No hay misiones semanales activas</div>
        </div>`;
      } else {
        weeklyContainer.innerHTML = weekly.map(missionCard).join('');
      }
    }

function updateXpRing(xp, xpNeeded = 1000) {
      const pct = Math.min(100, (xp % xpNeeded) / xpNeeded * 100);
      const ring = document.getElementById('xp-ring');
      if (ring) {
        ring.style.background = `conic-gradient(var(--mg-primary) ${pct}%, var(--mg-border) 0%)`;
      }
      const val = document.getElementById('xp-ring-val');
      if (val) val.textContent = xp % xpNeeded;
    }

    async function load(user) {
      await initSidebar('dashboard');

      const displayName = user.displayName || user.email?.split('@')[0] || 'Usuario';
      document.getElementById('dash-avatar').textContent = getInitials(displayName);
      
      const hour = new Date().getHours();
      const greeting = hour < 12 ? '¡Buenos días' : hour < 18 ? '¡Buenas tardes' : '¡Buenas noches';
      document.getElementById('dash-greeting').textContent = `${greeting}, ${displayName.split(' ')[0]}!`;

      // Cargar datos de Firestore (fallback local)
      const [progressSnap, userSnap, attemptsSnap] = await Promise.allSettled([
        getDoc(doc(db, 'mathgo_progress', user.uid)),
        getDoc(doc(db, 'users', user.uid)),
        getDocs(query(collection(db, 'attempts'), where('userId', '==', user.uid))),
      ]);
      const progress = (progressSnap.status === 'fulfilled' && progressSnap.value.exists()) ? progressSnap.value.data() : {};
      const userData = (userSnap.status === 'fulfilled' && userSnap.value.exists()) ? userSnap.value.data() : {};

      const xp = progress.totalXp ?? 0;
      const streak = progress.dailyStreak ?? 0;
      const gems = progress.gems ?? 0;
      
      const level = Math.floor(xp / 100) + 1;

      document.getElementById('d-xp').textContent = xp;
      document.getElementById('d-level').textContent = level;
      document.getElementById('d-gems').textContent = gems;
      document.getElementById('d-streak').textContent = streak;

      const streakMsg = streak >= 7 ? '¡En racha!' : streak >= 3 ? '¡Vas bien!' : '¡Comienza hoy!';
      document.getElementById('d-streak-msg').textContent = streakMsg;
      document.getElementById('dash-subtitle').textContent = `Nivel ${level} · ${xp} XP total · ${streak} días de racha`;

      // Actualizar panel derecho con racha
      const rightStreak = document.getElementById('right-streak-num');
      if (rightStreak) rightStreak.textContent = streak;
      const rightBar = document.getElementById('right-streak-bar');
      if (rightBar) rightBar.style.width = `${Math.min(100, (streak / 30) * 100)}%`;
      const rightMsg = document.getElementById('right-streak-msg');
      if (rightMsg) rightMsg.textContent = streak >= 7 ? '¡En racha!' : streak >= 3 ? '¡Vas bien!' : '¡Comienza hoy!';

      updateXpRing(xp);
      renderTopics(progress.worlds);

      // Precisión global desde colección 'attempts'
      if (attemptsSnap.status === 'fulfilled') {
        const docs = attemptsSnap.value.docs;
        const totalAttempts = docs.length;
        if (totalAttempts === 0) {
          document.getElementById('d-accuracy').textContent = '–';
          document.getElementById('d-accuracy-sub').textContent = 'Sin datos aún';
        } else {
          const correctAttempts = docs.filter(d => d.data().isCorrect === true).length;
          const precisionGlobal = Math.round((correctAttempts / totalAttempts) * 100);
          const precColor = precisionGlobal >= 90 ? 'var(--mg-success)' : precisionGlobal >= 70 ? 'var(--mg-xp)' : 'var(--mg-danger)';
          const accEl = document.getElementById('d-accuracy');
          accEl.textContent = `${precisionGlobal}%`;
          accEl.style.color = precColor;
          document.getElementById('d-accuracy-icon').style.color = precColor;
          document.getElementById('d-accuracy-sub').textContent = `${correctAttempts} de ${totalAttempts} intentos correctos`;
        }
      }

      // Intentar cargar analytics del backend (para gráfica semanal)
      const { data: analytics } = await getAnalytics();
      if (analytics?.weeklyXp) renderActivityChart(analytics.weeklyXp);
      else renderActivityChart([0, 20, 45, 30, 0, 80, xp % 100]);

      // Misiones
      const { data: missions } = await getMissions();
      renderMissions(missions);
    }

    requireAuth(false).then(user => load(user));
  </script>
</body>
</html>
