<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Aprender</title>
  <meta name="description" content="Elige tu mundo y comienza a aprender álgebra con MathGo." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="mg-layout" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">
      <!-- Stats bar -->
      <div class="mg-stats-bar" id="stats-bar">
        <div class="mg-stat-chip str">
          <i class="fa-solid fa-fire"></i>
          <strong id="stat-streak">–</strong> días
        </div>
        <div class="mg-stat-chip gem">
          <i class="fa-solid fa-gem"></i>
          <strong id="stat-gems">–</strong>
        </div>
        <div class="mg-stat-chip xp">
          <i class="fa-solid fa-bolt"></i>
          <strong id="stat-xp">–</strong> XP
        </div>
      </div>

      <!-- Hero banner -->
      <div class="mg-hero-banner mg-mb-6">
        <small><i class="fa-solid fa-book-open"></i> Curso de Álgebra</small>
        <h1>Elige tu mundo</h1>
      </div>

      <!-- Mundos -->
      <section>
        <h2 class="mg-section-heading">
          <i class="fa-solid fa-map" style="color:var(--mg-primary);"></i> Mapa de mundos
        </h2>
        <div class="mg-worlds-grid" id="worlds-grid">
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
        </div>
      </section>
    </main>

    <!-- Panel derecho -->
    <aside class="mg-right" id="mg-right">
      <div class="mg-profile-card" id="profile-card">
        <div class="mg-avatar" id="right-avatar">?</div>
        <div class="mg-profile-card-info">
          <h3 id="right-name">Cargando...</h3>
          <span id="right-level">Nivel –</span>
        </div>
      </div>

      <!-- Misiones -->
      <div class="mg-card mg-card-sm">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-bullseye" style="color:var(--mg-primary);"></i> Misiones diarias
        </h2>
        <div id="missions-list">
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:80%; height:14px;"></div>
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:65%; height:14px;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="width:72%; height:14px;"></div>
        </div>
      </div>

      <a href="dashboard.html" class="mg-btn mg-btn-secondary mg-btn-full mg-btn-sm"
         style="text-align:center; display:block;">
        <i class="fa-solid fa-chart-line"></i> Ver mi progreso completo
      </a>
    </aside>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <script type="module">
    import { requireAuth, getInitials, showToast } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { getMissions } from '../js/services/api.js';
    import { db } from '../js/firebaseConfig.js';
    import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    const WORLD_DATA = [
      { id: '1', icon: 'fa-solid fa-drafting-compass', title: 'Las Bases del Álgebra',           sub: 'Del pensamiento aritmético al algebraico',   href: 'world-1.html' },
      { id: '2', icon: 'fa-solid fa-infinity',          title: 'Números Reales',                  sub: 'Clasificación, propiedades y jerarquía',     href: 'world-2.html' },
      { id: '3', icon: 'fa-solid fa-chart-simple',      title: 'Funciones y Ecuaciones Lineales', sub: 'Descifra el lenguaje de las relaciones',     href: 'world-3.html' },
      { id: '4', icon: 'fa-solid fa-wave-square',       title: 'Funciones Cuadráticas',           sub: 'Domina la curva que rige el universo',       href: 'world-4.html' },
      { id: '5', icon: 'fa-solid fa-table-cells',       title: 'Matrices y Sistemas Avanzados',   sub: 'Organiza el caos en filas y columnas',       href: 'world-5.html' },
      { id: '6', icon: 'fa-solid fa-atom',              title: 'Números Complejos y Vectores',    sub: 'Donde lo imaginario se vuelve real',         href: 'world-6.html' },
    ];

    function renderWorlds(unlockedIds, isAdmin) {
      const grid = document.getElementById('worlds-grid');
      grid.innerHTML = WORLD_DATA.map(w => {
        const unlocked = isAdmin || unlockedIds.includes(w.id);
        return `
          <a href="${unlocked ? w.href : '#'}"
             class="mg-world-card ${unlocked ? 'unlocked' : 'locked'}"
             ${unlocked ? '' : 'aria-disabled="true" tabindex="-1"'}>
            <span class="mg-world-icon" style="font-size:28px; width:52px; height:52px; background:${unlocked ? 'rgba(79,70,229,0.1)' : 'var(--mg-border)'}; border-radius:14px; display:flex; align-items:center; justify-content:center; color:${unlocked ? 'var(--mg-primary)' : 'var(--mg-muted-2)'}; flex-shrink:0;">
              <i class="${w.icon}"></i>
            </span>
            <div class="mg-world-body">
              <div class="mg-world-num">Mundo ${w.id}</div>
              <div class="mg-world-title">${w.title}</div>
              <p class="mg-world-sub">${w.sub}</p>
            </div>
            <span class="mg-world-arrow">
              <i class="fa-solid ${unlocked ? 'fa-chevron-right' : 'fa-lock'}" style="color: ${unlocked ? 'var(--mg-primary)' : 'var(--mg-muted-2)'};"></i>
            </span>
          </a>
        `;
      }).join('');
    }

    function renderMissions(missions) {
      const container = document.getElementById('missions-list');
      if (!missions || missions.length === 0) {
        container.innerHTML = `
          <div class="mg-empty" style="padding:16px 0;">
            <i class="fa-solid fa-bullseye" style="font-size:32px; color:var(--mg-muted-2); margin-bottom:8px;"></i>
            <div class="mg-empty-text">No hay misiones activas hoy</div>
          </div>`;
        return;
      }
      container.innerHTML = missions.slice(0, 3).map(m => `
        <div class="mg-mission-item">
          <div class="mg-mission-header">
            <span class="mg-mission-title">${m.description || m.title || 'Misión'}</span>
            <span class="mg-mission-xp"><i class="fa-solid fa-bolt"></i> +${m.xpReward || 0} XP</span>
          </div>
          <div class="mg-progress">
            <div class="mg-progress-bar xp" style="width: ${Math.min(100, (m.currentProgress / (m.targetProgress || 1)) * 100)}%"></div>
          </div>
        </div>
      `).join('');
    }

    async function loadLearnPage(user) {
      await initSidebar('learn');

      const todayStr = new Date().toLocaleDateString('en-CA');

      const [progressSnap, userSnap] = await Promise.allSettled([
        getDoc(doc(db, 'mathgo_progress', user.uid)),
        getDoc(doc(db, 'users', user.uid)),
      ]);

      const progress = (progressSnap.status === 'fulfilled' && progressSnap.value.exists()) ? progressSnap.value.data() : {};
      const userData = (userSnap.status === 'fulfilled' && userSnap.value.exists()) ? userSnap.value.data() : {};

      const isAdmin = userData.role === 'admin';
      const displayName = userData.name || user.email?.split('@')[0] || 'Usuario';

      // Racha diaria
      const lastDate = progress.lastActiveDate ?? null;
      let streak = progress.dailyStreak ?? 0;
      if (lastDate !== todayStr) {
        const gap = lastDate
          ? Math.round((new Date(todayStr + 'T12:00:00') - new Date(lastDate + 'T12:00:00')) / 86400000)
          : null;
        streak = gap === 1 ? streak + 1 : 1;
        setDoc(doc(db, 'mathgo_progress', user.uid), { dailyStreak: streak, lastActiveDate: todayStr }, { merge: true }).catch(() => {});
      }

      const xp = progress.totalXp ?? userData.totalXp ?? 0;
      document.getElementById('stat-streak').textContent = streak;
      document.getElementById('stat-gems').textContent   = progress.gems ?? userData.gems ?? 0;
      document.getElementById('stat-xp').textContent     = xp;

      // Perfil derecho
      document.getElementById('right-avatar').textContent = getInitials(displayName);
      document.getElementById('right-name').textContent   = displayName;
      let totalCompleted = 0;
      Object.values(progress.worlds ?? {}).forEach(w => { totalCompleted += (w.levelsCompleted ?? []).length; });
      document.getElementById('right-level').textContent  = `Nivel ${totalCompleted + 1}`;

      // Mundos desbloqueados
      const worlds = progress.worlds ?? {};
      const unlocked = ['1'];
      if (isAdmin || worlds['1']?.allComplete) unlocked.push('2');
      if (isAdmin || worlds['2']?.allComplete) unlocked.push('3');
      if (isAdmin || worlds['3']?.allComplete) unlocked.push('4');
      if (isAdmin || worlds['4']?.allComplete) unlocked.push('5');
      if (isAdmin || worlds['5']?.allComplete) unlocked.push('6');
      renderWorlds(unlocked, isAdmin);

      // Misiones
      const { data: missions } = await getMissions();
      if (missions) {
        renderMissions(missions);
      } else {
        renderMissions([
          { description: 'Gana 100 XP hoy',         xpReward: 20, currentProgress: xp % 100,           targetProgress: 100 },
          { description: 'Mantén tu racha activa',   xpReward: 10, currentProgress: Math.min(streak, 5), targetProgress: 5 },
          { description: 'Completa 1 lección',       xpReward: 30, currentProgress: totalCompleted > 0 ? 1 : 0, targetProgress: 1 },
        ]);
      }
    }

    requireAuth(false).then(user => loadLearnPage(user));
  </script>
</body>
</html>
