<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Aprender</title>
  <meta name="description" content="Elige tu mundo y comienza a aprender álgebra con MathGo." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
  <style>
    .objetivo-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--mg-border-soft); }
    .objetivo-item:last-child { border-bottom:none; }
    .objetivo-text { flex:1; font-size:13px; font-weight:600; color:var(--mg-text-2); word-break:break-word; }
    .objetivo-del { background:none; border:none; cursor:pointer; color:var(--mg-muted-2); font-size:20px; line-height:1; padding:0 4px; border-radius:6px; transition:color var(--mg-transition); }
    .objetivo-del:hover { color:var(--mg-danger); }
  </style>
</head>
<body>

  <div class="mg-layout" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">
      <!-- Stats bar -->
      <div class="mg-stats-bar" id="stats-bar">
        <div class="mg-stat-chip str">
          <i class="fa-solid fa-fire"></i>
          <strong id="stat-streak">–</strong> días
        </div>
        <div class="mg-stat-chip gem">
          <i class="fa-solid fa-gem"></i>
          <strong id="stat-gems">–</strong>
        </div>
        <div class="mg-stat-chip xp">
          <i class="fa-solid fa-bolt"></i>
          <strong id="stat-xp">–</strong> XP
        </div>
      </div>

      <!-- Hero banner -->
      <div class="mg-hero-banner mg-mb-6">
        <small><i class="fa-solid fa-book-open"></i> Curso de Álgebra</small>
        <h1>Elige tu mundo</h1>
      </div>

      <!-- Mundos -->
      <section>
        <h2 class="mg-section-heading">
          <i class="fa-solid fa-map" style="color:var(--mg-primary);"></i> Mapa de mundos
        </h2>
        <div class="mg-worlds-grid" id="worlds-grid">
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
          <div class="mg-skeleton" style="height: 96px; border-radius: 18px;"></div>
        </div>
      </section>
    </main>

    <!-- Panel derecho -->
    <aside class="mg-right" id="mg-right">
      <div class="mg-profile-card" id="profile-card">
        <div class="mg-avatar" id="right-avatar">?</div>
        <div class="mg-profile-card-info">
          <h3 id="right-name">Cargando...</h3>
          <span id="right-level">Nivel –</span>
        </div>
      </div>

      <!-- Objetivos personales -->
      <div class="mg-card mg-card-sm">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-bullseye" style="color:var(--mg-primary);"></i> Mis objetivos
        </h2>
        <div id="obj-list">
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:80%; height:14px;"></div>
          <div class="mg-skeleton mg-skeleton-text mg-mb-4" style="width:65%; height:14px;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="width:72%; height:14px;"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <input type="text" id="obj-input" class="mg-input"
            placeholder="Nuevo objetivo..."
            style="padding:10px 12px;font-size:13px;border-radius:12px;" />
          <button id="obj-add-btn" class="mg-btn mg-btn-primary mg-btn-sm"
            aria-label="Agregar objetivo">+</button>
        </div>
      </div>

      <a href="dashboard.html" class="mg-btn mg-btn-secondary mg-btn-full mg-btn-sm"
         style="text-align:center; display:block;">
        <i class="fa-solid fa-chart-line"></i> Ver mi progreso completo
      </a>
    </aside>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <script type="module">
    import { requireAuth, getInitials } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { db } from '../js/firebaseConfig.js';
    import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
    import { BANNER_CATALOG, getBannerStyle } from '../js/banner-catalog.js';

    const WORLD_DATA = [
      { id: '1', icon: 'fa-solid fa-drafting-compass', title: 'Las Bases del Álgebra',           sub: 'Del pensamiento aritmético al algebraico',   href: 'world-1.html' },
      { id: '2', icon: 'fa-solid fa-infinity',          title: 'Números Reales',                  sub: 'Clasificación, propiedades y jerarquía',     href: 'world-2.html' },
      { id: '3', icon: 'fa-solid fa-chart-simple',      title: 'Funciones y Ecuaciones Lineales', sub: 'Descifra el lenguaje de las relaciones',     href: 'world-3.html' },
      { id: '4', icon: 'fa-solid fa-wave-square',       title: 'Funciones Cuadráticas',           sub: 'Domina la curva que rige el universo',       href: 'world-4.html' },
      { id: '5', icon: 'fa-solid fa-table-cells',       title: 'Matrices y Sistemas Avanzados',   sub: 'Organiza el caos en filas y columnas',       href: 'world-5.html' },
      { id: '6', icon: 'fa-solid fa-atom',              title: 'Números Complejos y Vectores',    sub: 'Donde lo imaginario se vuelve real',         href: 'world-6.html' },
    ];

    function renderWorlds(unlockedIds, isAdmin, worlds) {
      const grid = document.getElementById('worlds-grid');
      grid.innerHTML = WORLD_DATA.map(w => {
        const unlocked = isAdmin || unlockedIds.includes(w.id);
        const mastered = worlds[w.id]?.finalExam?.passed === true;
        const badge = mastered
          ? `<span title="Mundo dominado" style="position:absolute;top:-6px;right:-6px;background:#f59e0b;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.2);"><i class="fa-solid fa-award"></i></span>`
          : '';
        return `
          <a href="${w.href}"
             class="mg-world-card ${unlocked ? 'unlocked' : 'locked'}">
            <span class="mg-world-icon" style="position:relative;font-size:28px; width:52px; height:52px; background:${unlocked ? 'rgba(90,18,54,0.1)' : 'var(--mg-border)'}; border-radius:14px; display:flex; align-items:center; justify-content:center; color:${unlocked ? 'var(--mg-primary)' : 'var(--mg-muted-2)'}; flex-shrink:0;">
              <i class="${w.icon}"></i>
              ${badge}
            </span>
            <div class="mg-world-body">
              <div class="mg-world-num">Mundo ${w.id}${mastered ? ' <span style="font-size:10px;font-weight:700;color:#92400e;background:rgba(245,158,11,.15);border-radius:6px;padding:1px 6px;vertical-align:middle;">DOMINADO</span>' : ''}</div>
              <div class="mg-world-title">${w.title}</div>
              <p class="mg-world-sub">${w.sub}</p>
            </div>
            <span class="mg-world-arrow">
              <i class="fa-solid ${unlocked ? 'fa-chevron-right' : 'fa-lock'}" style="color: ${unlocked ? 'var(--mg-primary)' : 'var(--mg-muted-2)'};"></i>
            </span>
          </a>
        `;
      }).join('');
    }

    async function loadLearnPage(user) {
      await initSidebar('learn');

      const [progressSnap, userSnap] = await Promise.allSettled([
        getDoc(doc(db, 'mathgo_progress', user.uid)),
        getDoc(doc(db, 'users', user.uid)),
      ]);

      const progress = (progressSnap.status === 'fulfilled' && progressSnap.value.exists()) ? progressSnap.value.data() : {};
      const userData = (userSnap.status === 'fulfilled' && userSnap.value.exists()) ? userSnap.value.data() : {};

      const isAdmin = userData.role === 'admin';
      const displayName = userData.name || user.email?.split('@')[0] || 'Usuario';

      // Aplicar banner equipado al hero
      const equippedBanner = userData.equippedBanner ?? null;
      const heroEl = document.querySelector('.mg-hero-banner');
      if (heroEl) heroEl.classList.add('has-banner');
      if (equippedBanner) {
        const bannerEntry = BANNER_CATALOG.find(b => b.id === equippedBanner);
        if (bannerEntry && heroEl) {
          const styleStr = getBannerStyle(bannerEntry);
          styleStr.split(';').filter(Boolean).forEach(decl => {
            const [prop, ...rest] = decl.split(':');
            const camel = prop.trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase());
            heroEl.style[camel] = rest.join(':').trim();
          });
        }
      }

      // Racha diaria (solo lectura — el backend la actualiza al completar ejercicios)
      const streak = progress.dailyStreak ?? 0;

      const xp = progress.totalXp ?? 0;
      document.getElementById('stat-streak').textContent = streak;
      document.getElementById('stat-gems').textContent   = progress.gems ?? 0;
      document.getElementById('stat-xp').textContent     = xp;

      // Perfil derecho
      document.getElementById('right-avatar').textContent = getInitials(displayName);
      document.getElementById('right-name').textContent   = displayName;
      let totalCompleted = 0;
      Object.values(progress.worlds ?? {}).forEach(w => { totalCompleted += (w.levelsCompleted ?? []).length; });
      document.getElementById('right-level').textContent  = `Nivel ${totalCompleted + 1}`;

      // Mundos desbloqueados
      const worlds = progress.worlds ?? {};
      const unlocked = ['1'];
      if (isAdmin || worlds['1']?.allComplete || worlds['2']?.jumpExam?.passed) unlocked.push('2');
      if (isAdmin || worlds['2']?.allComplete || worlds['3']?.jumpExam?.passed) unlocked.push('3');
      if (isAdmin || worlds['3']?.allComplete || worlds['4']?.jumpExam?.passed) unlocked.push('4');
      if (isAdmin || worlds['4']?.allComplete || worlds['5']?.jumpExam?.passed) unlocked.push('5');
      if (isAdmin || worlds['5']?.allComplete || worlds['6']?.jumpExam?.passed) unlocked.push('6');
      renderWorlds(unlocked, isAdmin, worlds);

      // Objetivos personales
      let currentObjetivos = userData.objetivos ?? [];

      function renderObjList(objetivos) {
        const container = document.getElementById('obj-list');
        if (!container) return;
        if (!objetivos?.length) {
          container.innerHTML = `<p style="font-size:13px;color:var(--mg-muted);margin:8px 0 0;">No tienes objetivos aún.</p>`;
          return;
        }
        container.innerHTML = objetivos.map((obj, i) => {
          const safe = obj.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          return `<div class="objetivo-item">
            <i class="fa-solid fa-bullseye" style="color:var(--mg-primary);font-size:12px;flex-shrink:0;"></i>
            <span class="objetivo-text">${safe}</span>
            <button class="objetivo-del" data-idx="${i}" title="Eliminar">×</button>
          </div>`;
        }).join('');
        container.querySelectorAll('.objetivo-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const idx = parseInt(btn.dataset.idx);
            currentObjetivos = currentObjetivos.filter((_, i) => i !== idx);
            setDoc(doc(db, 'users', user.uid), { objetivos: currentObjetivos }, { merge: true }).catch(() => {});
            renderObjList(currentObjetivos);
          });
        });
      }

      renderObjList(currentObjetivos);

      const objInput = document.getElementById('obj-input');
      const objAddBtn = document.getElementById('obj-add-btn');
      const doAdd = async () => {
        const text = objInput?.value?.trim();
        if (!text) return;
        objInput.value = '';
        currentObjetivos = [...currentObjetivos, text];
        setDoc(doc(db, 'users', user.uid), { objetivos: currentObjetivos }, { merge: true }).catch(() => {});
        renderObjList(currentObjetivos);
      };
      objAddBtn?.addEventListener('click', doAdd);
      objInput?.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
    }

    requireAuth(false).then(user => loadLearnPage(user));
  </script>
</body>
</html>
