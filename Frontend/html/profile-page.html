<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Mi Perfil</title>
  <meta name="description" content="Perfil de usuario en MathGo. Ve tus estadisticas, racha y logros." />
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <div class="mg-layout-2col" id="mg-layout">
    <!-- Sidebar inyectado -->

    <main class="mg-main" id="mg-main">

      <!-- Hero de perfil -->
      <div class="profile-hero">
        <div class="profile-hero-avatar" id="profile-avatar">?</div>
        <div class="profile-hero-info">
          <div class="profile-hero-name" id="profile-name">Cargando...</div>
          <div class="profile-hero-email" id="profile-email"></div>
          <div class="profile-hero-join" id="profile-join">
            <i class="fa-solid fa-calendar-days"></i> Cargando fecha...
          </div>
        </div>
        <a href="profile-edit-page.html" class="profile-hero-edit">
          <i class="fa-solid fa-pen"></i> Editar perfil
        </a>
      </div>

      <!-- Estadísticas -->
      <div class="profile-stats-grid">
        <div class="profile-stat-box">
          <div class="profile-stat-icon"><i class="fa-solid fa-bolt" style="color:var(--mg-xp);"></i></div>
          <div class="profile-stat-content">
            <div class="profile-stat-value mg-text-xp" id="stat-xp">–</div>
            <div class="profile-stat-label">XP Total</div>
          </div>
        </div>
        <div class="profile-stat-box">
          <div class="profile-stat-icon"><i class="fa-solid fa-fire" style="color:var(--mg-streak);"></i></div>
          <div class="profile-stat-content">
            <div class="profile-stat-value mg-text-streak" id="stat-streak">–</div>
            <div class="profile-stat-label">Racha actual</div>
          </div>
        </div>
      </div>

      <!-- Precision y progreso -->
      <div class="mg-card mg-mb-6">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-chart-line" style="color:var(--mg-primary);"></i> Estadísticas de aprendizaje
        </h2>
        <div class="mg-stats-grid">
          <div class="mg-stat-box">
            <div class="stat-box-icon" id="stat-accuracy-icon" style="color:var(--mg-success)"><i class="fa-solid fa-bullseye"></i></div>
            <div class="stat-box-content">
              <div class="mg-stat-value" id="stat-accuracy" style="color:var(--mg-success)">–</div>
              <div class="mg-stat-label">Precisión</div>
            </div>
          </div>
          <div class="mg-stat-box">
            <div class="stat-box-icon" style="color:var(--mg-primary)"><i class="fa-solid fa-star"></i></div>
            <div class="stat-box-content">
              <div class="mg-stat-value mg-text-primary" id="stat-level">–</div>
              <div class="mg-stat-label">Nivel actual</div>
            </div>
          </div>
          <div class="mg-stat-box">
            <div class="stat-box-icon" style="color:var(--mg-success)"><i class="fa-solid fa-circle-check"></i></div>
            <div class="stat-box-content">
              <div class="mg-stat-value" id="stat-completed">–</div>
              <div class="mg-stat-label">Niveles completados</div>
            </div>
          </div>
          <div class="mg-stat-box">
            <div class="stat-box-icon" style="color:var(--mg-streak)"><i class="fa-solid fa-fire"></i></div>
            <div class="stat-box-content">
              <div class="mg-stat-value mg-text-streak" id="stat-best-streak">–</div>
              <div class="mg-stat-label">Mejor racha</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mis Logros -->
      <div class="mg-card mg-mb-6">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-trophy" style="color:var(--mg-xp);"></i> Mis Logros
        </h2>
        <div class="mg-achievement-grid" id="achievements-grid">
          <div class="mg-skeleton mg-skeleton-text" style="height: 120px; width: 100%;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="height: 120px; width: 100%;"></div>
          <div class="mg-skeleton mg-skeleton-text" style="height: 120px; width: 100%;"></div>
        </div>
      </div>

      <!-- Mis objetivos -->
      <div class="mg-card">
        <h2 class="mg-card-title">
          <i class="fa-solid fa-bullseye" style="color:var(--mg-primary);"></i> Mis objetivos personales
        </h2>
        <div id="objetivos-lista" style="min-height:48px;">
          <div class="mg-empty" style="padding:16px 0;">
            <div class="mg-empty-icon" style="font-size:32px; color: var(--mg-muted-2);"><i class="fa-solid fa-bullseye"></i></div>
            <div class="mg-empty-text">No tienes objetivos. ¡Agrega uno abajo!</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <input type="text" id="objetivo-input" class="mg-input"
            placeholder="Escribe un objetivo personal..."
            style="border-radius:12px; padding:12px 16px; font-size:14px;" />
          <button id="objetivo-add-btn" class="mg-btn mg-btn-primary mg-btn-sm" aria-label="Agregar objetivo">+</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, getInitials, showToast } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { getAchievements } from '../js/services/api.js';
    import { db } from '../js/firebaseConfig.js';
    import { doc, getDoc, setDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
    import { BANNER_CATALOG, getBannerStyle } from '../js/banner-catalog.js';

    function renderObjetivos(objetivos, uid) {
      const lista = document.getElementById('objetivos-lista');
      if (!objetivos?.length) {
        lista.innerHTML = `<div class="mg-empty" style="padding:16px 0;">
          <div class="mg-empty-icon" style="font-size:32px; color: var(--mg-muted-2);"><i class="fa-solid fa-bullseye"></i></div>
          <div class="mg-empty-text">No tienes objetivos. ¡Agrega uno abajo!</div>
        </div>`;
        return;
      }
      lista.innerHTML = objetivos.map((obj, i) => {
        const safe = obj.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<div class="objetivo-item">
          <span style="font-size:16px; color: var(--mg-primary); margin-right: 8px;"><i class="fa-solid fa-bullseye"></i></span>
          <span class="objetivo-text">${safe}</span>
          <button class="objetivo-del" data-idx="${i}" title="Eliminar">×</button>
        </div>`;
      }).join('');

      lista.querySelectorAll('.objetivo-del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const idx = parseInt(btn.dataset.idx);
          const updated = objetivos.filter((_, i) => i !== idx);
          await setDoc(doc(db, 'users', uid), { objetivos: updated }, { merge: true });
          renderObjetivos(updated, uid);
        });
      });
    }

    async function load(user) {
      await initSidebar('profile');

      const [userSnap, progressSnap, attemptsSnap] = await Promise.allSettled([
        getDoc(doc(db, 'users', user.uid)),
        getDoc(doc(db, 'mathgo_progress', user.uid)),
        getDocs(query(collection(db, 'attempts'), where('userId', '==', user.uid))),
      ]);

      const userData = (userSnap.status === 'fulfilled' && userSnap.value.exists()) ? userSnap.value.data() : {};
      const progress = (progressSnap.status === 'fulfilled' && progressSnap.value.exists()) ? progressSnap.value.data() : {};

      const displayName = userData.name || user.displayName || user.email?.split('@')[0] || 'Usuario';
      const xp    = progress.totalXp ?? 0;
      const streak = progress.dailyStreak ?? 0;

      let totalCompleted = 0;
      Object.values(progress.worlds ?? {}).forEach(w => { totalCompleted += (w.levelsCompleted ?? []).length; });

      // Banner equipado
      const equippedBanner = userData.equippedBanner ?? null;
      if (equippedBanner) {
        const bannerEntry = BANNER_CATALOG.find(b => b.id === equippedBanner);
        if (bannerEntry) {
          const heroEl = document.querySelector('.profile-hero');
          const styleStr = getBannerStyle(bannerEntry);
          styleStr.split(';').filter(Boolean).forEach(decl => {
            const [prop, ...rest] = decl.split(':');
            const camel = prop.trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase());
            heroEl.style[camel] = rest.join(':').trim();
          });
        }
      }

      // Hero
      document.getElementById('profile-avatar').textContent = getInitials(displayName);
      document.getElementById('profile-name').textContent = displayName;
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('profile-join').innerHTML =
        `<i class="fa-solid fa-calendar-days" style="margin-right: 6px;"></i> Miembro desde ${userData.joinDate || new Date(user.metadata?.creationTime).toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' }) || 'Fecha desconocida'}`;

      // Stats top
      document.getElementById('stat-xp').textContent    = xp;
      document.getElementById('stat-streak').textContent = streak;

      // Precisión desde colección 'attempts'
      if (attemptsSnap.status === 'fulfilled') {
        const attemptDocs = attemptsSnap.value.docs;
        const total = attemptDocs.length;
        if (total > 0) {
          const correct = attemptDocs.filter(d => d.data().isCorrect === true).length;
          const pct = Math.round((correct / total) * 100);
          const color = pct >= 90 ? 'var(--mg-success)' : pct >= 70 ? 'var(--mg-xp)' : 'var(--mg-danger)';
          const accEl = document.getElementById('stat-accuracy');
          accEl.textContent = `${pct}%`;
          accEl.style.color = color;
          document.getElementById('stat-accuracy-icon').style.color = color;
        }
      }
      document.getElementById('stat-level').textContent        = totalCompleted + 1;
      document.getElementById('stat-completed').textContent    = totalCompleted;
      document.getElementById('stat-best-streak').textContent  = userData.bestStreak ?? streak;

      // Cargar y Renderizar Logros
      const grid = document.getElementById('achievements-grid');
      try {
        const res = await getAchievements();
        const achievements = res?.data || res || [];
        
        if (achievements && achievements.length > 0) {
          grid.innerHTML = achievements.map(ach => {
            const statusClass = ach.unlocked ? 'unlocked' : 'locked';
            const unlockInfo = ach.unlocked 
              ? `<div class="mg-badge mg-badge-success" style="font-size: 10px; padding: 2px 8px; margin-top: 6px;">Desbloqueado</div>` 
              : `<div class="mg-badge mg-badge-locked" style="font-size: 10px; padding: 2px 8px; margin-top: 6px;"><i class="fa-solid fa-lock"></i> Bloqueado</div>`;
            
            return `
              <div class="mg-achievement ${statusClass}">
                <div class="mg-achievement-icon" style="margin-bottom: var(--mg-space-2);">
                  <img src="../assets/images/achievements/${ach.icon}.png" alt="${ach.name}" 
                       style="width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto; transition: transform var(--mg-transition);" />
                </div>
                <div class="mg-achievement-name" style="font-weight: 800; font-size: 14px; margin-bottom: 2px;">${ach.name}</div>
                <div class="mg-achievement-desc" style="font-size: 11px; color: var(--mg-muted); line-height: 1.3;">${ach.description}</div>
                ${unlockInfo}
              </div>
            `;
          }).join('');
        } else {
          grid.innerHTML = `
            <div class="mg-empty" style="grid-column: 1 / -1; padding: 24px 0;">
              <div class="mg-empty-icon" style="font-size: 36px; color: var(--mg-muted-2);"><i class="fa-solid fa-trophy"></i></div>
              <div class="mg-empty-text">No se encontraron logros disponibles.</div>
            </div>
          `;
        }
      } catch (err) {
        console.error('Error al cargar logros:', err);
        grid.innerHTML = `
          <div class="mg-empty" style="grid-column: 1 / -1; padding: 24px 0; color: var(--mg-danger);">
            <div class="mg-empty-icon" style="font-size: 36px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="mg-empty-text">Error al cargar los logros. Por favor, intenta de nuevo.</div>
          </div>
        `;
      }

      // Objetivos
      const objetivos = userData.objetivos ?? [];
      renderObjetivos(objetivos, user.uid);

      // Agregar objetivo
      const addBtn   = document.getElementById('objetivo-add-btn');
      const addInput = document.getElementById('objetivo-input');
      const doAdd = async () => {
        const text = addInput.value.trim();
        if (!text) return;
        const fresh = await getDoc(doc(db, 'users', user.uid));
        const current = fresh.exists() ? (fresh.data().objetivos ?? []) : [];
        const updated = [...current, text];
        await setDoc(doc(db, 'users', user.uid), { objetivos: updated }, { merge: true });
        addInput.value = '';
        renderObjetivos(updated, user.uid);
        showToast('¡Objetivo agregado!', 'success');
      };
      addBtn.addEventListener('click', doAdd);
      addInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
    }

    requireAuth(false).then(user => load(user));
  </script>
</body>
</html>
