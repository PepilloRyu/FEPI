<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathGo — Asignaciones</title>
  <link rel="icon" href="../assets/images/favicon.ico" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
  <style>
    /* ── Hero ── */
    .assign-hero {
      display: flex;
      align-items: center;
      gap: 20px;
      background: linear-gradient(135deg, var(--mg-surface) 0%, rgba(79,70,229,.06) 100%);
      border: 1px solid var(--mg-border);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    .assign-hero-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(79,70,229,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: var(--mg-primary); flex-shrink: 0;
    }
    .assign-hero h1 { margin: 0 0 4px; font-size: 20px; }
    .assign-hero p  { margin: 0; color: var(--mg-muted); font-size: 14px; }

    /* ── Section labels ── */
    .assign-section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--mg-muted);
      margin: 24px 0 12px;
    }
    .assign-section-label:first-child { margin-top: 0; }

    /* ── Cards grid ── */
    .assign-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* ── Assignment card ── */
    .assign-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border-radius: 14px;
      background: var(--mg-surface);
      border: 1px solid var(--mg-border);
      border-left: 4px solid var(--mg-border);
      transition: box-shadow .15s, transform .1s;
    }
    .assign-card.status-pending { border-left-color: var(--mg-primary); }
    .assign-card.status-overdue { border-left-color: var(--mg-error, #ef4444); }
    .assign-card.status-done    { border-left-color: var(--mg-success, #22c55e); opacity: .82; }

    .assign-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .assign-card-title {
      font-size: 15px; font-weight: 700;
      color: var(--mg-text); line-height: 1.35;
    }

    .assign-card-scope {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--mg-muted);
    }

    .assign-card-footer {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--mg-border);
    }
    .assign-card-date {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--mg-muted);
    }

    /* ── Practicar button ── */
    .btn-practice {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border: none; border-radius: 8px;
      background: var(--mg-primary); color: #fff;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .btn-practice:hover { opacity: .88; }

    /* ── Skeleton ── */
    .assign-grid-skeleton {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="mg-layout" id="mg-layout">
    <!-- Sidebar inyectado por JS -->

    <main class="mg-main" id="mg-main">

      <div class="assign-hero">
        <div class="assign-hero-icon"><i class="fa-solid fa-clipboard-list"></i></div>
        <div>
          <h1>Asignaciones</h1>
          <p>Tareas asignadas por tus profesores</p>
        </div>
      </div>

      <div id="assignments-container">
        <div class="assign-grid-skeleton">
          <div class="mg-skeleton" style="height:148px;border-radius:14px;"></div>
          <div class="mg-skeleton" style="height:148px;border-radius:14px;"></div>
          <div class="mg-skeleton" style="height:148px;border-radius:14px;"></div>
        </div>
      </div>

    </main>
  </div>

  <div class="mg-toast-container" id="mg-toast-container"></div>

  <script type="module">
    import { requireAuth } from '../js/services/auth.js';
    import { initSidebar } from '../js/components/sidebar.js';
    import { db } from '../js/firebaseConfig.js';
    import {
      doc, getDoc, getDocs,
      collection, query, where,
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    // ── Catálogo de mundos ────────────────────────────────
    const WORLDS = [
      { id: 1, title: 'Las Bases del Álgebra',           icon: 'fa-solid fa-drafting-compass', href: 'world-1.html' },
      { id: 2, title: 'Números Reales',                  icon: 'fa-solid fa-infinity',          href: 'world-2.html' },
      { id: 3, title: 'Funciones y Ecuaciones Lineales', icon: 'fa-solid fa-chart-simple',      href: 'world-3.html' },
      { id: 4, title: 'Funciones Cuadráticas',           icon: 'fa-solid fa-wave-square',       href: 'world-4.html' },
      { id: 5, title: 'Matrices y Sistemas Avanzados',   icon: 'fa-solid fa-table-cells',       href: 'world-5.html' },
      { id: 6, title: 'Números Complejos y Vectores',    icon: 'fa-solid fa-atom',              href: 'world-6.html' },
    ];

    const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    function formatDueDate(dateStr) {
      if (!dateStr) return '—';
      const [y, m, d] = dateStr.split('-');
      const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return `${parseInt(d)} ${months[parseInt(m) - 1]} ${y}`;
    }

    function assignmentScope(worldId, levelId) {
      const w = WORLDS.find(w => w.id === worldId);
      if (!w) return `Mundo ${worldId}`;
      return levelId === null
        ? `Mundo ${worldId} — ${w.title}`
        : `Mundo ${worldId} — Nivel ${levelId + 1}`;
    }

    // Misma lógica que teacher.html: IDs base-0, worldKey string
    function isCompleted(a, progress) {
      const wp = progress?.worlds?.[String(a.worldId)] ?? {};
      if (a.levelId == null) return wp.allComplete === true;
      return (wp.levelsCompleted ?? []).includes(Number(a.levelId));
    }

    async function loadAssignments(user) {
      await initSidebar('assignments');
      const container = document.getElementById('assignments-container');

      try {
        // Progreso del alumno + sus classrooms en paralelo
        const [progressSnap, classroomsSnap] = await Promise.all([
          getDoc(doc(db, 'mathgo_progress', user.uid)),
          getDocs(query(
            collection(db, 'classrooms'),
            where('studentIds', 'array-contains', user.uid)
          )),
        ]);

        const progress   = progressSnap.exists() ? progressSnap.data() : {};
        const classrooms = [];
        classroomsSnap.forEach(d => classrooms.push({ id: d.id, name: d.data().name || '—' }));

        if (!classrooms.length) {
          renderEmpty(container);
          return;
        }

        // Asignaciones de todos los classrooms del alumno
        const snapshots = await Promise.all(
          classrooms.map(c => getDocs(query(
            collection(db, 'assignments'),
            where('classroomId', '==', c.id)
          )))
        );

        const assignments = [];
        snapshots.forEach((snap, i) => {
          const cName = classrooms[i].name;
          snap.forEach(d => assignments.push({ id: d.id, _classroomName: cName, ...d.data() }));
        });

        if (!assignments.length) {
          renderEmpty(container);
          return;
        }

        renderAssignments(container, assignments, progress);
      } catch (err) {
        console.error('Error al cargar asignaciones:', err);
        container.innerHTML = `
          <div class="mg-empty">
            <div class="mg-empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="mg-empty-title">Error al cargar asignaciones</div>
            <div class="mg-empty-sub">Intenta recargar la página</div>
          </div>`;
      }
    }

    function renderEmpty(container) {
      container.innerHTML = `
        <div class="mg-empty">
          <div class="mg-empty-icon"><i class="fa-solid fa-clipboard-list"></i></div>
          <div class="mg-empty-title">Sin asignaciones</div>
          <div class="mg-empty-sub">Aún no tienes asignaciones de ningún profesor</div>
        </div>`;
    }

    function renderAssignments(container, assignments, progress) {
      const today = new Date().toISOString().split('T')[0];

      const overdue = [], pending = [], done = [];
      assignments.forEach(a => {
        if (isCompleted(a, progress)) {
          done.push(a);
        } else if (a.dueDate && a.dueDate < today) {
          overdue.push(a);
        } else {
          pending.push(a);
        }
      });

      // Vencidas y pendientes: más urgentes primero; completadas: más recientes primero
      overdue.sort((a, b) => (a.dueDate ?? '').localeCompare(b.dueDate ?? ''));
      pending.sort((a, b) => (a.dueDate ?? '').localeCompare(b.dueDate ?? ''));
      done.sort((a, b) => (b.dueDate ?? '').localeCompare(a.dueDate ?? ''));

      const html = [];

      if (overdue.length) {
        html.push(`
          <div class="assign-section-label">
            <i class="fa-solid fa-triangle-exclamation" style="color:var(--mg-error,#ef4444);"></i>
            Vencidas (${overdue.length})
          </div>
          <div class="assign-grid">${overdue.map(a => buildCard(a, 'overdue')).join('')}</div>`);
      }
      if (pending.length) {
        html.push(`
          <div class="assign-section-label">
            <i class="fa-solid fa-clock" style="color:var(--mg-primary);"></i>
            Pendientes (${pending.length})
          </div>
          <div class="assign-grid">${pending.map(a => buildCard(a, 'pending')).join('')}</div>`);
      }
      if (done.length) {
        html.push(`
          <div class="assign-section-label">
            <i class="fa-solid fa-circle-check" style="color:var(--mg-success,#22c55e);"></i>
            Completadas (${done.length})
          </div>
          <div class="assign-grid">${done.map(a => buildCard(a, 'done')).join('')}</div>`);
      }

      container.innerHTML = html.join('');
    }

    function buildCard(a, status) {
      const wId   = a.worldId;
      const lId   = a.levelId == null ? null : Number(a.levelId);
      const w     = WORLDS.find(w => w.id === wId);
      const wIcon = w ? w.icon : 'fa-solid fa-earth-americas';
      const wHref = w ? w.href : 'learn.html';
      const scope = assignmentScope(wId, lId);
      const due   = formatDueDate(a.dueDate);

      const badgeMap = {
        done:    `<span class="mg-badge" style="color:var(--mg-success,#22c55e);border-color:var(--mg-success,#22c55e);gap:4px;white-space:nowrap;"><i class="fa-solid fa-circle-check" style="font-size:11px;"></i> Completada</span>`,
        overdue: `<span class="mg-badge" style="color:var(--mg-error,#ef4444);border-color:var(--mg-error,#ef4444);gap:4px;white-space:nowrap;"><i class="fa-solid fa-triangle-exclamation" style="font-size:11px;"></i> Vencida</span>`,
        pending: `<span class="mg-badge" style="color:var(--mg-primary);border-color:var(--mg-primary);gap:4px;white-space:nowrap;"><i class="fa-solid fa-clock" style="font-size:11px;"></i> Pendiente</span>`,
      };

      const practiceBtn = status !== 'done'
        ? `<a href="${wHref}" class="btn-practice"><i class="fa-solid fa-play"></i> Practicar</a>`
        : '';

      return `
        <div class="assign-card status-${status}">
          <div class="assign-card-header">
            <span class="assign-card-title">${escHtml(a.title)}</span>
            ${badgeMap[status]}
          </div>
          <div class="assign-card-scope">
            <i class="${wIcon}" style="color:var(--mg-primary);font-size:15px;flex-shrink:0;"></i>
            <span>${escHtml(scope)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mg-muted);">
            <i class="fa-solid fa-chalkboard" style="font-size:11px;"></i>
            <span>${escHtml(a._classroomName)}</span>
          </div>
          <div class="assign-card-footer">
            <span class="assign-card-date">
              <i class="fa-solid fa-calendar" style="font-size:12px;"></i> ${escHtml(due)}
            </span>
            ${practiceBtn}
          </div>
        </div>`;
    }

    requireAuth(false).then(user => loadAssignments(user));
  </script>
</body>
</html>
