            <a href="" class="button-in-sidebar">

              <div class="description">
                No ads, personalized practice, and unlimited Legendary!
              </div>
              <button id="try-super-button" onclick="openSuperDuolingoPage();">
                Try 2 weeks free
              </button>
            </div>

          <div class="try-super-box">

                <div class="description">
                  Compite con otros jugadores
                </div>
              </div>
            </div>
          </div>
        </div>
        <!----------------------------------- Scrollable area showing units ------------------------------------------------>
        <div
          class="scrollable-lesson-div active"
          onclick="closeAllOpenDialogBoxes()"
        ></div>
      </div>
    </div>
    <div class="loading-screen hidden">
      <div class="text-animation-container">
        <div class="lesson-loading-svg" id="owl-walk-animation"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/js-circle-progress/dist/circle-progress.min.js"

    ></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.7/lottie.min.js"></script>
  <script src="../js/learn.js"></script>
  <script src="../js/updateUserData.js" type="module"></script>


  <script type="module">
    import { auth } from '../js/firebaseConfig.js';
    import { signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    
    // Función para cerrar sesión
    window.cerrarSesion = async function() {
        try {
            await signOut(auth);
            // Eliminar datos del localStorage
            localStorage.removeItem('mathgo_user');
            // Redirigir al inicio
            window.location.href = '../index.html';
        } catch (error) {
            console.error('Error al cerrar sesión:', error);
            alert('Error al cerrar sesión: ' + error.message);
        }
    };
    
    // Verificar si el usuario está logueado
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            // Si no hay usuario, redirigir al login
            window.location.href = '../index.html';
        } else {
            console.log('Usuario logueado:', user.email);
        }
    });
</script>
</html>
