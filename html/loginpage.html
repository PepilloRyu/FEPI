<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathGo - Iniciar Sesión</title>
    <link rel="icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/loginpage.css" />
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="signup-page-container">
        <div class="close-button-div">
          <a href="../index.html">
            <img src="../assets/svg/close-button.svg" alt="close button" />
          </a>
        </div>
        <div class="login-button-container">
          <button
            class="login-button button-div"
            id="login-button"
            onclick="window.location.href='../html/signup.html'"
          >
            Comenzar
          </button>
        </div>
        
        <form class="signup-section-main" id="main-form">
          <div class="signup-information-div">
            <h1 class="create-profile-heading">Ingresar</h1>
            <div class="input-fields-div">
              <div class="field-one">
                <input
                  class="input-field"
                  id="email-input"
                  type="email"
                  placeholder="Email"
                />
                <div class="error-message" id="email-error-message"></div>
              </div>

              <div class="field-one password-div">
                <input
                  class="input-field password-input"
                  id="password-input"
                  type="password"
                  placeholder="Contraseña"
                />
                <a class="forgot" id="forgot-password" style="cursor: pointer;">
                  ¿Olvidaste tu contraseña?
                </a>
                <div class="error-message" id="password-error-message"></div>
              </div>
            </div>

            <div class="create-account-button-container">
              <button
                type="submit"
                class="create-account-button button-div"
                id="create-account-button"
              >
                <span id="login-span">INICIAR SESIÓN</span>
                <div
                  class="loading-balls-container hidden"
                  style="transition-duration: 250ms"
                  id="loading-balls-container"
                >
                  <div class="animation loading-ball"></div>
                  <div class="animation second-animation loading-ball"></div>
                  <div class="animation third-animation loading-ball"></div>
                </div>
              </button>
            </div>
          </div>

          <div class="split-line"></div>
        </form>
      </div>
    </div>

    <script type="module">
      // Importar Firebase
      import { app } from '../js/firebaseConfig.js';
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      
      const auth = getAuth(app);
      const db = getFirestore(app);
      
      // Verificar si el usuario ya está logueado
      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Si ya está logueado, redirigir a learn.html
          window.location.href = '../html/learn.html';
        }
      });
      
      // Manejar el formulario de login
      const form = document.getElementById('main-form');
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const loginButton = document.getElementById('create-account-button');
      const loadingContainer = document.getElementById('loading-balls-container');
      const loginSpan = document.getElementById('login-span');
      const emailError = document.getElementById('email-error-message');
      const passwordError = document.getElementById('password-error-message');
      
      // Función para mostrar errores
      function showError(element, message) {
        element.textContent = message;
        element.style.display = 'block';
      }
      
      function clearErrors() {
        emailError.textContent = '';
        emailError.style.display = 'none';
        passwordError.textContent = '';
        passwordError.style.display = 'none';
      }
      
      // Manejar el submit del formulario
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        
        // Validaciones básicas
        if (!email) {
          showError(emailError, 'Por favor ingresa tu email');
          return;
        }
        
        if (!password) {
          showError(passwordError, 'Por favor ingresa tu contraseña');
          return;
        }
        
        // Mostrar loading
        loginSpan.classList.add('hidden');
        loadingContainer.classList.remove('hidden');
        loginButton.disabled = true;
        
        try {
          // Iniciar sesión con Firebase
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          
          // Obtener datos del usuario desde Firestore
          const userDoc = await getDoc(doc(db, "users", user.uid));
          
          if (userDoc.exists()) {
            const userData = userDoc.data();
            // Guardar datos en localStorage para usar en la app
            localStorage.setItem('mathgo_user', JSON.stringify({
              uid: user.uid,
              name: userData.name,
              email: userData.email,
              level: userData.level || 'beginner',
              totalXp: userData.totalXp || 0,
              streak: userData.streak || 0
            }));
          }
          
          // Redirigir a la página de aprendizaje
          window.location.href = '../html/learn.html';
          
        } catch (error) {
          console.error('Error al iniciar sesión:', error);
          
          // Mostrar mensaje de error según el código
          let errorMessage = 'Error al iniciar sesión';
          switch (error.code) {
            case 'auth/invalid-email':
              errorMessage = 'El formato del email no es válido';
              break;
            case 'auth/user-not-found':
              errorMessage = 'No existe una cuenta con este email';
              break;
            case 'auth/wrong-password':
              errorMessage = 'Contraseña incorrecta';
              break;
            case 'auth/too-many-requests':
              errorMessage = 'Demasiados intentos. Intenta más tarde';
              break;
            default:
              errorMessage = error.message;
          }
          
          showError(passwordError, errorMessage);
          
          // Ocultar loading
          loginSpan.classList.remove('hidden');
          loadingContainer.classList.add('hidden');
          loginButton.disabled = false;
        }
      });
      
      // Manejar el botón de "¿Olvidaste tu contraseña?"
      const forgotPasswordLink = document.getElementById('forgot-password');
      forgotPasswordLink.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        
        if (!email) {
          showError(emailError, 'Por favor ingresa tu email para restablecer la contraseña');
          return;
        }
        
        try {
          const { sendPasswordResetEmail } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
          await sendPasswordResetEmail(auth, email);
          alert('Se ha enviado un correo para restablecer tu contraseña');
        } catch (error) {
          console.error('Error al enviar correo:', error);
          let errorMessage = 'Error al enviar correo';
          if (error.code === 'auth/user-not-found') {
            errorMessage = 'No existe una cuenta con este email';
          }
          showError(emailError, errorMessage);
        }
      });
    </script>
  </body>
</html>
